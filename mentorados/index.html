<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Mentorados · Demanda Infinita</title>
<link rel="icon" href="../logo-demanda-infinita.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
:root{
  color-scheme: light;
  --plane:#f6f8f6; --surface-1:#ffffff; --surface-2:#fbfcfb;
  --text-primary:#0b0b0b; --text-secondary:#52514e; --muted:#7a7872;
  --grid:#e4e6e1; --baseline:#c3c2b7; --border:rgba(11,11,11,.13); --field-bg:#f5f6f4;
  --accent:#0ca30c; --accent-deep:#0a7d22; --accent-wash:#e7f6e7; --accent-glow:rgba(12,163,12,.16);
  --good:#0ca30c; --warning:#fab219; --critical:#d03b3b;
  --st-rascunho-bg:#eceae5; --st-rascunho-tx:#4b4a46;
  --st-aguardando-bg:#fff1cc; --st-aguardando-tx:#7a5200;
  --st-ajustes-bg:#fde6da; --st-ajustes-tx:#9a3d17;
  --st-aprovado-bg:#e1f5e1; --st-aprovado-tx:#0a6a1c;
  --st-reprovado-bg:#fbe1df; --st-reprovado-tx:#9a2620;
  --st-publicado-bg:#e1ecfb; --st-publicado-tx:#1a53a3;
  --radius:14px; --ink:28,34,28;
  --sombra-1:0 1px 2px rgba(var(--ink),.05),0 1px 3px rgba(var(--ink),.04);
  --sombra-2:0 2px 4px rgba(var(--ink),.05),0 6px 16px -6px rgba(var(--ink),.10);
  --sombra-3:0 4px 8px rgba(var(--ink),.06),0 14px 34px -10px rgba(var(--ink),.18);
  --sidebar-w:212px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:Manrope,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text-primary);
  background:radial-gradient(1100px 520px at 78% -12%,rgba(12,163,12,.055),transparent 62%),var(--plane);
  background-attachment:fixed;-webkit-font-smoothing:antialiased;line-height:1.45}
h1,h2,h3,h4{margin:0;letter-spacing:-.02em}
h1{font-size:1.35rem;font-weight:800}
h2{font-size:1.02rem;font-weight:800}
h3{font-size:.92rem;font-weight:700}
p{margin:0}
a{color:var(--accent-deep)}
button,input,select,textarea{font-family:inherit;font-size:.92rem;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--muted)} .sec{color:var(--text-secondary)}
.mono{font-variant-numeric:tabular-nums}
.kicker{font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-deep);font-weight:800}

/* ---------- botões ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--border);background:var(--surface-1);
  color:var(--text-primary);padding:9px 16px;border-radius:10px;font-weight:700;font-size:.88rem;line-height:1.1;
  transition:background .16s,border-color .16s,transform .16s,box-shadow .16s;text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--field-bg)}
.btn:active{transform:translateY(1px)}
.btn:focus-visible,.nav-item:focus-visible,.tab:focus-visible,.chip-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn-primary{background:linear-gradient(140deg,var(--accent),var(--accent-deep));border-color:transparent;color:#fff;box-shadow:0 4px 12px -4px var(--accent-glow)}
.btn-primary:hover{background:linear-gradient(140deg,#0fb30f,var(--accent-deep))}
.btn-danger{color:var(--critical);border-color:rgba(208,59,59,.35)}
.btn-danger:hover{background:#fbe9e8}
.btn-warn{background:#fff1cc;border-color:#f0d58a;color:var(--st-aguardando-tx)}
.btn-sm{padding:6px 11px;font-size:.8rem;border-radius:9px}
.btn[disabled]{opacity:.5;cursor:not-allowed;pointer-events:none}
.btn-link{border:0;background:none;color:var(--accent-deep);padding:2px 0;font-weight:700;font-size:.82rem;cursor:pointer}
.btn-link:hover{text-decoration:underline}

/* ---------- campos ---------- */
label.lbl{display:block;font-size:.74rem;font-weight:700;color:var(--text-secondary);margin:0 0 5px}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=url],input[type=date],select,textarea{
  width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:10px;background:var(--surface-1);font-size:.92rem}
textarea{resize:vertical;min-height:90px;line-height:1.5}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent)}
.campo{margin-bottom:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.hint{font-size:.76rem;color:var(--muted);margin-top:4px}

/* ---------- casca ---------- */
#carregando{display:flex;align-items:center;justify-content:center;min-height:100vh;color:var(--muted);font-weight:600}
#tela-login{min-height:100vh;display:none;align-items:center;justify-content:center;padding:20px}
.login-box{background:var(--surface-1);border:1px solid var(--border);border-radius:var(--radius);padding:34px 30px;width:100%;max-width:380px;box-shadow:var(--sombra-3)}
.login-box img.logo{width:60px;height:60px;border-radius:50%;display:block;margin:0 0 16px}
.login-box h1{margin:4px 0 4px}
.login-box .sub{color:var(--text-secondary);font-size:.88rem;margin-bottom:22px}
.login-box .btn{width:100%;padding:11px;margin-top:4px}
.erro{color:var(--critical);font-size:.82rem;margin-top:10px;display:none}
.app-shell{display:none;min-height:100vh}
.sidebar{width:var(--sidebar-w);flex-shrink:0;background:var(--accent);display:flex;flex-direction:column;padding:16px 10px;
  position:sticky;top:0;height:100vh;align-self:flex-start;overflow-y:auto}
.sidebar .marca{display:flex;align-items:center;gap:10px;color:#fff;font-weight:800;letter-spacing:-.02em;padding:2px 8px 16px}
.sidebar .marca img{width:32px;height:32px;border-radius:50%;background:#fff}
.sidebar .marca small{display:block;font-size:.62rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.8}
.sidebar nav{display:flex;flex-direction:column;gap:3px}
.nav-item{position:relative;display:flex;align-items:center;gap:11px;border:0;background:none;color:rgba(255,255,255,.88);
  padding:10px 11px;border-radius:11px;font-weight:700;font-size:.88rem;text-align:left;transition:background .16s,color .16s}
.nav-item svg{width:20px;height:20px;flex-shrink:0;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav-item:hover{background:rgba(255,255,255,.12);color:#fff}
.nav-item.ativo{background:#fff;color:var(--accent-deep);box-shadow:var(--sombra-2)}
.nav-item .cont{margin-left:auto;background:var(--critical);color:#fff;border-radius:99px;font-size:.66rem;min-width:19px;height:19px;padding:0 5px;
  display:none;align-items:center;justify-content:center}
.nav-item.piscando{animation:pisca 1.15s ease-in-out infinite}
@keyframes pisca{0%,100%{box-shadow:0 0 0 2px #fff}50%{box-shadow:0 0 0 6px rgba(255,255,255,.28)}}
.sidebar .rodape{margin-top:auto;padding:14px 8px 0;color:rgba(255,255,255,.75);font-size:.7rem}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 28px;
  background:rgba(246,248,246,.86);backdrop-filter:saturate(1.6) blur(14px);-webkit-backdrop-filter:saturate(1.6) blur(14px);
  border-bottom:1px solid rgba(var(--ink),.07)}
.topbar .titulo{min-width:0}
.topbar .titulo .kicker{margin-bottom:1px}
.topbar .titulo h1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .dir{display:flex;align-items:center;gap:10px}
.userchip{display:flex;align-items:center;gap:8px;border:1px solid var(--border);background:var(--surface-1);border-radius:99px;padding:4px 12px 4px 5px;font-weight:700;font-size:.82rem;max-width:200px}
.userchip .av{width:26px;height:26px;border-radius:50%;background:var(--accent-wash);color:var(--accent-deep);display:flex;align-items:center;justify-content:center;font-size:.76rem;font-weight:800;flex-shrink:0}
.userchip span.nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.user-wrap{position:relative}
.menu-pop{position:absolute;right:0;top:44px;z-index:50;min-width:190px;background:var(--surface-1);border:1px solid var(--border);border-radius:12px;box-shadow:var(--sombra-3);padding:6px;display:none}
.menu-pop.aberto{display:block}
.menu-pop button{display:block;width:100%;text-align:left;border:0;background:none;padding:9px 11px;border-radius:8px;font-weight:600;font-size:.86rem}
.menu-pop button:hover{background:var(--field-bg)}
#view{width:100%;max-width:1120px;margin:0 auto;padding:24px 28px 90px}
.banner-preview{background:#1d2a1f;color:#fff;padding:9px 28px;font-size:.84rem;font-weight:600;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.banner-preview .btn{background:#fff;color:#1d2a1f;border:0}

/* ---------- sino ---------- */
.notif-wrap{position:relative}
.notif-bell{position:relative;background:var(--surface-1);border:1px solid var(--border);color:var(--text-secondary);width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center}
.notif-bell svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.notif-badge{position:absolute;top:-5px;right:-5px;min-width:17px;height:17px;padding:0 4px;border-radius:99px;background:var(--critical);color:#fff;font-size:.64rem;font-weight:800;display:none;align-items:center;justify-content:center;box-shadow:0 0 0 2px var(--plane)}
.notif-panel{position:absolute;top:46px;right:0;z-index:60;width:360px;max-width:calc(100vw - 24px);max-height:70vh;background:var(--surface-1);border:1px solid var(--border);border-radius:14px;box-shadow:var(--sombra-3);display:none;flex-direction:column;overflow:hidden}
.notif-panel.aberto{display:flex}
.notif-head{display:flex;align-items:center;justify-content:space-between;padding:11px 14px;border-bottom:1px solid var(--grid)}
.notif-lista{overflow-y:auto}
.notif-sec{font-size:.66rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:10px 14px 4px}
.notif-item{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--grid);background:none;padding:10px 14px}
.notif-item:hover{background:var(--field-bg)}
.notif-item.nao-lida{background:var(--accent-wash)}
.notif-item .t{font-size:.84rem;font-weight:700}
.notif-item .d{font-size:.78rem;color:var(--text-secondary);margin-top:2px}
.notif-item .h{font-size:.68rem;color:var(--muted);margin-top:3px}

/* ---------- superfícies ---------- */
.card{background:var(--surface-1);border:1px solid rgba(var(--ink),.09);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--sombra-1)}
.card > h2{margin-bottom:3px}
.card .desc{color:var(--text-secondary);font-size:.84rem;margin-bottom:14px}
.card.destaque{border-color:rgba(12,163,12,.45);background:linear-gradient(180deg,#fbfffb,var(--surface-1));box-shadow:0 0 0 3px var(--accent-glow),var(--sombra-1)}
.card.alerta{border-color:#f0d58a;background:#fffbee}
.row-between{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:14px}
.stack > .card{margin-bottom:0}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.tile{position:relative;overflow:hidden;background:linear-gradient(180deg,var(--surface-1),var(--surface-2));border:1px solid rgba(var(--ink),.09);border-radius:var(--radius);padding:15px 16px;box-shadow:var(--sombra-1)}
.tile::before{content:"";position:absolute;inset:0 0 auto 0;height:2px;background:linear-gradient(90deg,var(--accent),transparent 72%);opacity:.5}
.tile .v{font-size:1.8rem;font-weight:800;letter-spacing:-.03em;line-height:1.1}
.tile .l{font-size:.66rem;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-top:4px}
.vazio{color:var(--muted);font-size:.86rem;padding:18px 0;text-align:center}
.vazio b{color:var(--text-secondary)}
.bar{height:8px;border-radius:99px;background:var(--grid);overflow:hidden}
.bar > i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),#38c738);border-radius:99px;transition:width .35s ease}
.bar.fina{height:5px}

/* ---------- chips e status ---------- */
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:99px;font-size:.72rem;font-weight:800;white-space:nowrap}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.75}
.chip.rascunho{background:var(--st-rascunho-bg);color:var(--st-rascunho-tx)}
.chip.aguardando{background:var(--st-aguardando-bg);color:var(--st-aguardando-tx)}
.chip.ajustes{background:var(--st-ajustes-bg);color:var(--st-ajustes-tx)}
.chip.aprovado{background:var(--st-aprovado-bg);color:var(--st-aprovado-tx)}
.chip.reprovado{background:var(--st-reprovado-bg);color:var(--st-reprovado-tx)}
.chip.publicado{background:var(--st-publicado-bg);color:var(--st-publicado-tx)}
.chip.ok{background:var(--st-aprovado-bg);color:var(--st-aprovado-tx)}
.chip.alerta{background:var(--st-aguardando-bg);color:var(--st-aguardando-tx)}
.chip.critico{background:var(--st-reprovado-bg);color:var(--st-reprovado-tx)}
.chip.neutro{background:var(--st-rascunho-bg);color:var(--st-rascunho-tx)}
.chip.sem-dot::before{display:none}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--grid);margin-bottom:18px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:10px 14px;font-weight:700;font-size:.86rem;color:var(--text-secondary);border-bottom:2px solid transparent;white-space:nowrap;margin-bottom:-1px}
.tab:hover{color:var(--text-primary)}
.tab.ativo{color:var(--accent-deep);border-bottom-color:var(--accent)}
.chips-filtro{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.chip-btn{border:1px solid var(--border);background:var(--surface-1);border-radius:99px;padding:6px 13px;font-size:.8rem;font-weight:700;color:var(--text-secondary)}
.chip-btn:hover{background:var(--field-bg)}
.chip-btn.ativo{background:var(--accent);border-color:var(--accent);color:#fff}

/* ---------- listas ---------- */
.item-lista{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--grid)}
.item-lista:last-child{border-bottom:0}
.item-lista .txt{min-width:0;font-size:.9rem;font-weight:600}
.item-lista .txt small{display:block;color:var(--muted);font-size:.76rem;font-weight:500;margin-top:2px}
.item-lista.clicavel{cursor:pointer}
.item-lista.clicavel:hover .txt{color:var(--accent-deep)}
.mrow{display:block;width:100%;text-align:left;background:var(--surface-1);border:1px solid rgba(var(--ink),.09);border-radius:12px;padding:14px 16px;margin-bottom:10px;box-shadow:var(--sombra-1);transition:box-shadow .16s,border-color .16s}
.mrow:hover{box-shadow:var(--sombra-2);border-color:rgba(12,163,12,.45)}
.mrow .nome{font-weight:800;font-size:.96rem}
.mrow .meta{color:var(--muted);font-size:.78rem;margin-top:2px}
.mrow .stats{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px;font-size:.78rem;color:var(--text-secondary)}
.mrow .stats b{color:var(--text-primary)}

/* ---------- etapas ---------- */
.stepper{display:flex;gap:6px;margin:0 0 18px;flex-wrap:wrap}
.step{flex:1;min-width:118px;background:var(--surface-1);border:1px solid var(--grid);border-radius:11px;padding:10px 12px}
.step.done{background:var(--accent-wash);border-color:rgba(12,163,12,.35)}
.step.atual{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow)}
.step .n{font-size:.66rem;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.step.done .n{color:var(--accent-deep)}
.step .t{font-weight:700;font-size:.84rem;margin-top:2px}

/* ---------- checklist de hoje ---------- */
.hoje-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.hoje-item{border:1px solid var(--grid);border-radius:12px;padding:13px 14px;background:var(--surface-2)}
.hoje-item.feito{background:var(--accent-wash);border-color:rgba(12,163,12,.4)}
.hoje-item .tt{font-size:.74rem;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--text-secondary)}
.hoje-item .meta{font-size:.76rem;color:var(--muted);margin-top:2px}
.num-ctl{display:flex;align-items:center;gap:8px;margin-top:9px}
.num-ctl button{width:34px;height:34px;border-radius:10px;border:1px solid var(--border);background:var(--surface-1);font-size:1.1rem;font-weight:800;line-height:1}
.num-ctl button:hover{background:var(--field-bg)}
.num-ctl input{width:64px;text-align:center;font-weight:800;font-size:1.1rem;padding:6px}

/* ---------- posts ---------- */
.post-card{display:block;width:100%;text-align:left;background:var(--surface-1);border:1px solid rgba(var(--ink),.09);border-radius:12px;padding:14px 16px;margin-bottom:10px;box-shadow:var(--sombra-1)}
.post-card:hover{box-shadow:var(--sombra-2);border-color:rgba(12,163,12,.45)}
.post-card .tt{font-weight:800;font-size:.94rem;margin-bottom:3px}
.post-card .pv{color:var(--text-secondary);font-size:.84rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-line}
.post-card .rod{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:9px;font-size:.76rem;color:var(--muted)}
.post-layout{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:18px;align-items:start}
.post-corpo{background:var(--surface-1);border:1px solid var(--grid);border-radius:12px;padding:16px 18px;white-space:pre-wrap;word-wrap:break-word;font-size:.95rem;line-height:1.55}
.gancho{border-left:3px solid var(--accent);background:var(--accent-wash);border-radius:0 10px 10px 0;padding:10px 14px;margin-bottom:12px;font-size:.88rem;white-space:pre-wrap}
.gancho small{display:block;font-size:.66rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--accent-deep);margin-bottom:3px}
.contador{font-size:.76rem;color:var(--muted);text-align:right;margin-top:4px}
.contador.alto{color:var(--critical);font-weight:700}
.anexos{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.anexo{display:flex;align-items:center;gap:10px;border:1px solid var(--grid);border-radius:10px;padding:8px 10px;background:var(--surface-2);font-size:.84rem}
.anexo .thumb{width:44px;height:44px;border-radius:8px;background:var(--field-bg);object-fit:cover;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:.64rem;font-weight:800;color:var(--muted)}
.anexo .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.anexo .tam{color:var(--muted);font-size:.74rem}
.thread{display:flex;flex-direction:column;gap:10px}
.msg{border-radius:12px;padding:10px 13px;font-size:.88rem;border:1px solid var(--grid);background:var(--surface-2);white-space:pre-wrap;word-wrap:break-word}
.msg .quem{font-size:.7rem;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px;white-space:normal}
.msg.admin{background:var(--accent-wash);border-color:rgba(12,163,12,.3)}
.msg.sistema{background:transparent;border:0;padding:2px 4px;color:var(--text-secondary);font-size:.8rem;text-align:center}
.msg.ajuste{background:#fff6ef;border-color:#f3c9b3}
.msg.reprov{background:#fff2f1;border-color:#f1bdb9}
.decisao{border:2px solid var(--accent);border-radius:14px;padding:16px;background:#fbfffb}
.decisao .botoes{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.faixa-status{display:flex;align-items:flex-start;gap:12px;border-radius:12px;padding:13px 15px;margin-bottom:14px;font-size:.9rem}
.faixa-status b{display:block;font-size:.95rem;margin-bottom:2px}
.faixa-status.aguardando{background:var(--st-aguardando-bg);color:var(--st-aguardando-tx)}

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    if (error) throw error;
    out = out.concat(data || []);
    if (!data || data.length < tam) return out;
    de += tam;
  }
}

function resolverCtx(p) {
  if (S.admin) {
    if (p[0] === 'ver' && p[1]) return { modo: 'preview', clienteId: Number(p[1]), base: `ver/${p[1]}`, tela: p[2] || 'inicio', args: p.slice(3) };

function montarNav(ctx) {
  const itens = ctx.modo === 'admin' ? NAV_ADMIN : NAV_CLIENTE;
  const ativa = ctx.modo === 'admin' ? (ADMIN_ATIVA[ctx.tela] || ctx.tela) : ctx.tela;
  $('#nav').innerHTML = itens.map(([id, nome]) => {

};

// opt.silencioso = refresh disparado por realtime: mantém o conteúdo na tela, preserva a rolagem e nunca mostra erro
async function render(opt = {}) {
  if (!S.perfil) return;
  const silencioso = !!opt.silencioso;
  const tk = ++S.tk;
  const ctx = resolverCtx(rota());
  if (!ctx) { ir(S.admin ? 'admin/dashboard' : 'inicio'); return; }
  S.ctx = ctx;
  montarNav(ctx);
  const faixa = $('#banner-preview');
  if (ctx.modo === 'preview') {
    const c = await getCliente(ctx.clienteId);
    faixa.hidden = false;
    faixa.innerHTML = `<span>Você está vendo o portal como <b>${esc(c ? c.nome : 'mentorado')}</b>. Modo somente leitura: nada aqui altera os dados dele.</span><a class="btn btn-sm" href="#/admin/mentorado/${ctx.clienteId}">Voltar ao admin</a>`;
  } else faixa.hidden = true;

  const tabela = ctx.modo === 'admin' ? VIEWS_ADMIN : VIEWS_CLIENTE;
  const fn = tabela[ctx.tela];
  if (!fn) { ir(ctx.modo === 'admin' ? 'admin/dashboard' : (ctx.base ? ctx.base + '/' : '') + 'inicio'); return; }
  const view = $('#view');
  if (!silencioso) view.innerHTML = '<div class="vazio">carregando…</div>';
  try {
    const r = await fn(ctx);
    if (tk !== S.tk) return;                       // navegou de novo enquanto carregava
    const y = window.scrollY;
    $('#top-kicker').textContent = r.kicker || '';
    $('#top-titulo').textContent = r.titulo || '';
    view.innerHTML = r.html;
    S.refrescavel = r.refrescavel !== false;
    if (r.depois) await r.depois();
    window.scrollTo(0, silencioso ? y : 0);
  } catch (e) {
    if (tk !== S.tk) return;
    console.error(e);
    if (silencioso) return;
    view.innerHTML = `<div class="card"><h2>Não deu pra carregar</h2><p class="desc">${esc(msgErro(e))}</p><button class="btn" data-act="recarregar">Tentar de novo</button></div>`;
  }
}

/* ---------- sino (notificações computadas ao vivo; só o "lida" é gravado) ---------- */
const NOTIF_SECOES = ['Aprovações', 'Posts', 'Checklist', 'Plano', 'Pendências'];
async function carregarNotifs() {
  const lista = [];
  try {
    if (S.admin) await notifsAdmin(lista); else await notifsCliente(lista, S.perfil.cliente_id);
  } catch (e) { console.warn('notifs', e); }
  S.notifs = lista.sort((a, b) => b.quando - a.quando);
  try {
    const l = await paginado(() => sb.from('cli_notif_lidas').select('chave').eq('perfil_id', S.user.id).order('chave'));
    S.lidas = new Set(l.map(x => x.chave));
  } catch (e) { /* segue sem o estado de lida */ }
  renderNotifs();
  if (S.ctx) montarNav(S.ctx);
}
async function notifsAdmin(out) {
  const cls = await clientes();
  const nome = id => (cls.find(c => c.id === id) || {}).nome || 'Mentorado';
  const ag = await paginado(() => sb.from('cli_posts').select('id,cliente_id,titulo,versao,enviado_em').eq('status', 'aguardando').order('enviado_em').order('id'));
  S.contAguardando = ag.length;
  ag.forEach(p => out.push({ chave: `post-${p.id}-v${p.versao}-aguardando`, sec: 'Aprovações', titulo: `${nome(p.cliente_id)} enviou um post`,
    desc: `${p.titulo || 'Sem título'}${p.versao > 1 ? ` · versão ${p.versao}` : ''}`, quando: new Date(p.enviado_em), href: `#/admin/post/${p.id}` }));
  const desde = new Date(Date.now() - 7 * 864e5).toISOString();
  const ev = await q(sb.from('cli_post_eventos').select('id,post_id,tipo,texto,criado_em').eq('autor_papel', 'cliente').in('tipo', ['comentario', 'publicacao']).gte('criado_em', desde).order('criado_em', { ascending: false }).limit(30));
  if (ev.length) {
    const posts = await q(sb.from('cli_posts').select('id,cliente_id,titulo').in('id', [...new Set(ev.map(e => e.post_id))]));
    ev.forEach(e => {
      const p = posts.find(x => x.id === e.post_id); if (!p) return;
      out.push({ chave: `evento-${e.id}`, sec: 'Posts', titulo: e.tipo === 'publicacao' ? `${nome(p.cliente_id)} publicou um post` : `${nome(p.cliente_id)} respondeu num post`,
        desc: p.titulo || 'Sem título', quando: new Date(e.criado_em), href: `#/admin/post/${p.id}` });
    });
  }
  const ontem = diaUtilAnterior(hojeISO());
  if (!fimDeSemana(hojeISO())) {
    // só cobra quem JÁ começou a usar (viu o tour antes de hoje). Quem ainda não recebeu/estreou acesso é ruído.
    const [perfis, tours] = await Promise.all([q(sb.from('cli_perfis').select('id,cliente_id').eq('role', 'cliente').not('cliente_id', 'is', null)), q(sb.from('cli_novidades_vistas').select('perfil_id,vista_em'))]);
    const hoje0 = hojeISO(), estreou = new Set(tours.filter(t => isoLocal(new Date(t.vista_em)) < hoje0).map(t => t.perfil_id));
    const comLogin = new Set(perfis.filter(p => estreou.has(p.id)).map(p => p.cliente_id));
    const ativos = cls.filter(c => c.status === 'ativo' && comLogin.has(c.id));
    const ativ = await paginado(() => sb.from('cli_atividades_diarias').select('*').eq('data', ontem).order('id'));
    const parados = ativos.filter(c => statusAtividade(ativ.find(a => a.cliente_id === c.id), c) !== 'completo');
    if (parados.length) out.push({ chave: `parados-${ontem}`, sec: 'Checklist', titulo: `${parados.length} ${parados.length === 1 ? 'mentorado não fechou' : 'mentorados não fecharam'} o checklist de ${ontem === addDias(hojeISO(), -1) ? 'ontem' : 'sexta'}`,
      desc: parados.slice(0, 3).map(c => primeiroNome(c.nome)).join(', ') + (parados.length > 3 ? '…' : ''), quando: new Date(ontem + 'T23:00:00'), href: '#/admin/dashboard' });
  }
}
async function notifsCliente(out, clienteId) {
  const posts = await paginado(() => sb.from('cli_posts').select('id,titulo,status').eq('cliente_id', clienteId).order('id'));
  S.contPosts = posts.filter(p => p.status === 'aprovado' || p.status === 'ajustes').length;
  if (posts.length) {
    const desde = new Date(Date.now() - 14 * 864e5).toISOString();
    const ev = await q(sb.from('cli_post_eventos').select('id,post_id,tipo,texto,criado_em').in('post_id', posts.map(p => p.id)).eq('autor_papel', 'admin').gte('criado_em', desde).order('criado_em', { ascending: false }).limit(30));
    const T = { aprovacao: ['Seu post foi aprovado', 'Publique e cole o link por aqui'], ajuste: ['Pediram ajustes no seu post', null], reprovacao: ['Seu post não foi aprovado', null], comentario: ['Nova mensagem no seu post', null] };
    ev.forEach(e => {
      const p = posts.find(x => x.id === e.post_id), t = T[e.tipo]; if (!p || !t) return;
      out.push({ chave: `evento-${e.id}`, sec: 'Posts', titulo: t[0], desc: `${p.titulo || 'Sem título'}${t[1] ? ' · ' + t[1] : e.texto ? ' · ' + e.texto.slice(0, 80) : ''}`, quando: new Date(e.criado_em), href: `#/posts/${p.id}` });
    });
  }
  const planos = await q(sb.from('cli_planos').select('id').eq('cliente_id', clienteId).eq('status', 'ativo'));
  if (planos.length) {
    const atras = await q(sb.from('cli_plano_itens').select('id').eq('plano_id', planos[0].id).eq('concluido', false).lt('prazo', hojeISO()));
    if (atras.length) out.push({ chave: `plano-atrasado-${hojeISO()}`, sec: 'Plano', titulo: `${atras.length} ${atras.length === 1 ? 'item do plano está atrasado' : 'itens do plano estão atrasados'}`,
      desc: 'Abra o plano e marque o que já fez', quando: new Date(), href: '#/plano' });
  }
  const pend = await q(sb.from('cli_materiais_pendentes').select('id,item,pedido_em').eq('cliente_id', clienteId).eq('status', 'pendente'));
  pend.forEach(p => out.push({ chave: `pend-${p.id}`, sec: 'Pendências', titulo: 'Falta você enviar um material', desc: p.item, quando: new Date(p.pedido_em), href: '#/inicio' }));
}
function renderNotifs() {
  const n = S.notifs.filter(x => !S.lidas.has(x.chave)).length;
  const b = $('#notif-badge');
  b.style.display = n ? 'flex' : 'none'; b.textContent = n > 9 ? '9+' : n;
  document.title = `${n ? `(${n}) ` : ''}Mentorados · Demanda Infinita`;
  const por = {}; S.notifs.forEach(x => (por[x.sec] = por[x.sec] || []).push(x));
  const html = NOTIF_SECOES.filter(s => por[s]).map(s => `<div class="notif-sec">${esc(s)}</div>` +
    por[s].slice(0, 10).map(x => `<button class="notif-item ${S.lidas.has(x.chave) ? '' : 'nao-lida'}" data-act="notif-abrir" data-chave="${esc(x.chave)}" data-href="${esc(x.href)}">
      <div class="t">${esc(x.titulo)}</div>${x.desc ? `<div class="d">${esc(x.desc)}</div>` : ''}<div class="h">${esc(fmtQuando(x.quando))}</div></button>`).join('')).join('');
  $('#notif-lista').innerHTML = html || '<div class="vazio">Nenhuma notificação por aqui.</div>';
}
async function marcarLidas(chaves) {
  const novas = chaves.filter(c => !S.lidas.has(c)); if (!novas.length) return;
  novas.forEach(c => S.lidas.add(c)); renderNotifs();
  await sb.from('cli_notif_lidas').upsert(novas.map(chave => ({ perfil_id: S.user.id, chave })), { onConflict: 'perfil_id,chave' });
}
ACT['notif-toggle'] = () => $('#notif-panel').classList.toggle('aberto');
ACT['notif-abrir'] = async el => {
  $('#notif-panel').classList.remove('aberto');
  await marcarLidas([el.dataset.chave]);
  const h = el.dataset.href; if (h) { if (location.hash === h) render(); else location.hash = h; }
};
ACT['notif-todas'] = () => marcarLidas(S.notifs.map(x => x.chave));

function assinarRealtime() {
  if (S.canal || !sb.channel) return;
  const atualizar = debounce(async () => {
    await carregarNotifs();
    // só atualiza a tela se ninguém estiver digitando nem com texto já escrito (não atropela formulário)
    const a = document.activeElement, digitando = a && /^(TEXTAREA|INPUT|SELECT)$/.test(a.tagName);
    const sujo = $$('#view textarea, #view input[type=text], #view input[type=url]').some(e => e.value !== e.defaultValue);
    if (S.refrescavel && !digitando && !sujo && !$('#modal-bg').classList.contains('aberto')) render({ silencioso: true });
  }, 900);
  S.canal = sb.channel('cli-rt')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'cli_posts' }, atualizar)
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'cli_post_eventos' }, atualizar)
    .subscribe();
}

  { emoji: '🗺️', titulo: 'Seu plano de ação', texto: 'É a sua lista de passos. Marque cada item quando concluir. Quem **vê** o progresso **mantém** o ritmo.', aba: 'plano' },

let tourI = 0;
async function verificarTour() {
  let vistas = [];
  try { vistas = await q(sb.from('cli_novidades_vistas').select('versao,vista_em').eq('perfil_id', S.user.id).order('vista_em')); } catch (e) { return; }
  const primeira = vistas[0];
  S.tourVistoEm = primeira ? primeira.vista_em : null;
  if (!vistas.some(v => v.versao === NOVIDADES.versao)) tourAbrir(0);
}
function tourAbrir(i) {
  tourI = i; const p = NOVIDADES.passos[i], ultimo = i === NOVIDADES.passos.length - 1;
  $$('.nav-item.piscando').forEach(b => b.classList.remove('piscando'));
  if (p.aba) { const b = $(`.nav-item[data-to="${p.aba}"]`); if (b) b.classList.add('piscando'); }
  const t = $('#tour'); t.classList.add('aberto');
  t.innerHTML = `<div class="tour-card"><button class="tour-fechar" data-act="tour-fechar" aria-label="Fechar">✕</button>
    <div class="tour-passo"><div class="tour-emoji">${p.emoji}</div><div class="tour-titulo">${esc(p.titulo)}</div><div class="tour-texto">${md(p.texto)}</div></div>
    <div class="tour-rodape"><div class="tour-pontos">${NOVIDADES.passos.map((_, k) => `<i class="${k === i ? 'ativo' : ''}"></i>`).join('')}</div>
    <div class="tour-botoes">${ultimo ? '' : '<button class="tour-pular" data-act="tour-fechar">pular tour</button>'}
    ${p.aba && !ultimo ? `<button class="btn btn-sm" data-act="tour-ir" data-aba="${p.aba}">me leva lá</button>` : ''}
    <button class="btn btn-primary btn-sm" data-act="${ultimo ? 'tour-fechar' : 'tour-prox'}">${ultimo ? 'Começar' : 'Próximo'}</button></div></div></div>`;
}
async function tourFechar() {
  $('#tour').classList.remove('aberto'); $('#tour').innerHTML = '';
  $$('.nav-item.piscando').forEach(b => b.classList.remove('piscando'));
  try { await sb.from('cli_novidades_vistas').upsert({ perfil_id: S.user.id, versao: NOVIDADES.versao }, { onConflict: 'perfil_id,versao' }); } catch (e) { /* tudo bem */ }
}
ACT['tour-fechar'] = tourFechar;
ACT['tour-prox'] = () => tourAbrir(Math.min(tourI + 1, NOVIDADES.passos.length - 1));
ACT['tour-abrir'] = () => { $('#user-menu').classList.remove('aberto'); tourAbrir(0); };
ACT['tour-ir'] = el => { const aba = el.dataset.aba; tourFechar(); ir(aba); };
document.addEventListener('keydown', ev => {
  if (!$('#tour').classList.contains('aberto')) return;
  if (ev.key === 'ArrowRight') ACT['tour-prox']();
  if (ev.key === 'ArrowLeft') tourAbrir(Math.max(0, tourI - 1));
  if (ev.key === 'Escape') tourFechar();
});

/* ---------- lembrete bloqueante (dentro do sistema, texto curto) ---------- */
async function lembreteChecklist() {
  if (S.admin || $('#tour').classList.contains('aberto')) return;
  const hoje = hojeISO(), ontem = diaUtilAnterior(hoje), quando = ontem === addDias(hoje, -1) ? 'ontem' : 'sexta';
  if (fimDeSemana(hoje)) return;                                // fim de semana não cobra; segunda cobra a sexta
  if (lsGet('lembrete-' + hoje)) return;                         // uma vez por dia
  if (!S.tourVistoEm || isoLocal(new Date(S.tourVistoEm)) >= hoje) return;   // não cobra quem entrou hoje pela 1ª vez
  const cli = await getCliente(S.perfil.cliente_id);
  if (!cli || cli.status !== 'ativo') return;
  const a = await q(sb.from('cli_atividades_diarias').select('*').eq('cliente_id', cli.id).eq('data', ontem).limit(1));
  if (statusAtividade(a[0], cli) === 'completo') return;
  lsSet('lembrete-' + hoje, '1');
  const t = $('#tour'); t.classList.add('aberto');
  t.innerHTML = `<div class="tour-card lembrete-card"><div class="tour-emoji">⏰</div><div class="tour-titulo">Você fechou o checklist de ${quando}?</div>
    <div class="tour-texto">${esc(fmtDiaSem(ontem))} ficou em aberto.</div>
    <div class="tour-rodape" style="justify-content:center"><div class="tour-botoes"><button class="btn" data-act="tour-fechar-simples">Ok</button>
    <button class="btn btn-primary" data-act="lembrete-preencher" data-dia="${ontem}">Preencher agora</button></div></div></div>`;
}
ACT['tour-fechar-simples'] = () => { $('#tour').classList.remove('aberto'); $('#tour').innerHTML = ''; };
ACT['lembrete-preencher'] = el => { ACT['tour-fechar-simples'](); ir('calendario'); setTimeout(() => ACT['dia-abrir'] && ACT['dia-abrir']({ dataset: { dia: el.dataset.dia } }), 400); };

/* =====================================================================
   CHECKLIST DIÁRIO (conexões · post · comentários) — usado no Início e no Calendário
   ===================================================================== */
function statusAtividade(a, cli) {
  if (!a) return 'vazio';
  const okCon = (a.conexoes || 0) >= (cli.meta_conexoes || 5);
  const okPost = !!a.post_feito;
  const okCom = (a.comentarios || 0) >= (cli.meta_comentarios_min || 5);
  if (okCon && okPost && okCom) return 'completo';
  if ((a.conexoes || 0) > 0 || a.post_feito || (a.comentarios || 0) > 0) return 'parcial';
  return 'vazio';
}
function normalizarLink(l) {
  l = (l || '').trim(); if (!l) return null;
  if (/^https?:\/\//i.test(l)) return l;
  if (/^[\w-]+(\.[\w-]+)+(\/\S*)?$/.test(l)) return 'https://' + l;
  throw new Error('O link do post precisa começar com https://');
}
async function salvarAtividade(clienteId, dia, v) {
  const { error } = await sb.from('cli_atividades_diarias').upsert({
    cliente_id: clienteId, data: dia, conexoes: v.conexoes, post_feito: v.post_feito,
    post_link: normalizarLink(v.post_link), comentarios: v.comentarios, atualizado_em: new Date().toISOString(),
  }, { onConflict: 'cliente_id,data' });
  if (error) throw error;
}
function formChecklist(dia, a, cli, opt = {}) {
  a = a || { conexoes: 0, comentarios: 0, post_feito: false, post_link: '' };
  const mC = cli.meta_conexoes || 5, mMin = cli.meta_comentarios_min || 5, mMax = cli.meta_comentarios_max || 10;
  const dis = opt.somenteLeitura ? 'disabled' : '';
  const numCtl = (campo, valor, rotulo) => `<div class="num-ctl">
    <button type="button" data-act="ck-num" data-campo="${campo}" data-d="-1" ${dis} aria-label="Menos ${rotulo}">−</button>
    <input type="number" name="${campo}" min="0" value="${valor || 0}" data-chg="ck" ${dis} aria-label="${rotulo}">
    <button type="button" data-act="ck-num" data-campo="${campo}" data-d="1" ${dis} aria-label="Mais ${rotulo}">+</button></div>`;
  return `<div data-ckform="${dia}" data-cli="${cli.id}" data-auto="${opt.auto ? 1 : 0}">
    <div class="hoje-grid">
      <div class="hoje-item ${(a.conexoes || 0) >= mC ? 'feito' : ''}" data-box="conexoes"><div class="tt">Conexões</div><div class="meta">meta: ${mC} por dia</div>${numCtl('conexoes', a.conexoes, 'conexões')}</div>
      <div class="hoje-item ${a.post_feito ? 'feito' : ''}" data-box="post"><div class="tt">Post</div><div class="meta">meta: ${cli.meta_semanal || 4} por semana</div>
        <label style="display:flex;gap:8px;align-items:center;margin-top:10px;font-weight:700;font-size:.88rem"><input type="checkbox" name="post_feito" ${a.post_feito ? 'checked' : ''} data-chg="ck" ${dis}> Postei neste dia</label>
        <input type="url" name="post_link" value="${esc(a.post_link || '')}" placeholder="Link do post (opcional)" data-chg="ck" ${dis} style="margin-top:8px"></div>
      <div class="hoje-item ${(a.comentarios || 0) >= mMin ? 'feito' : ''}" data-box="comentarios"><div class="tt">Comentários</div><div class="meta">meta: ${mMin} a ${mMax} em posts do seu público</div>${numCtl('comentarios', a.comentarios, 'comentários')}</div>
    </div>
    <div class="row-between" style="margin-top:12px"><span class="hint" data-ckstatus>${opt.auto && !opt.somenteLeitura ? 'Salva sozinho a cada mudança.' : ''}</span>
    ${opt.auto || opt.somenteLeitura ? '' : '<button type="button" class="btn btn-primary btn-sm" data-act="ck-salvar">Salvar</button>'}</div></div>`;
}
function lerForm(f) {
  const n = nm => f.querySelector(`[name=${nm}]`);
  return { conexoes: Math.max(0, parseInt(n('conexoes').value) || 0), comentarios: Math.max(0, parseInt(n('comentarios').value) || 0),
           post_feito: n('post_feito').checked, post_link: n('post_link').value.trim() };
}
async function atualizarBoxes(f) {
  const cli = await getCliente(f.dataset.cli), v = lerForm(f);
  const set = (box, on) => f.querySelector(`[data-box=${box}]`).classList.toggle('feito', on);
  set('conexoes', v.conexoes >= (cli.meta_conexoes || 5));
  set('post', v.post_feito);
  set('comentarios', v.comentarios >= (cli.meta_comentarios_min || 5));
}
const salvarFormDebounced = new WeakMap();
async function persistirForm(f) {
  const st = f.querySelector('[data-ckstatus]');
  try {
    await salvarAtividade(Number(f.dataset.cli), f.dataset.ckform, lerForm(f));
    if (st) st.textContent = 'Salvo ✓';
  } catch (e) { if (st) st.textContent = ''; throw e; }
}
function agendarSalvar(f) {
  const st = f.querySelector('[data-ckstatus]'); if (st) st.textContent = 'Salvando…';
  if (!salvarFormDebounced.has(f)) salvarFormDebounced.set(f, debounce(() => persistirForm(f).catch(erroAcao), 600));
  salvarFormDebounced.get(f)();
}
CHG['ck'] = async el => {
  const f = el.closest('[data-ckform]'); await atualizarBoxes(f);
  if (f.dataset.auto === '1') agendarSalvar(f);
};
ACT['ck-num'] = async el => {
  const f = el.closest('[data-ckform]'), inp = f.querySelector(`[name=${el.dataset.campo}]`);
  inp.value = Math.max(0, (parseInt(inp.value) || 0) + Number(el.dataset.d));
  await atualizarBoxes(f);
  if (f.dataset.auto === '1') agendarSalvar(f);
};
ACT['ck-salvar'] = async el => {
  const f = el.closest('[data-ckform]');
  await ocupado(el, () => persistirForm(f));
  const dia = f.dataset.ckform; fecharModal(); toast('Checklist de ' + fmtData(dia) + ' salvo.');
  await render();
};

/* =====================================================================

function renderStepper(prog) {
  const ok = new Set((prog || []).filter(p => p.concluida_em).map(p => p.etapa_id));
  let achou = false;
  return `<div class="stepper">${S.etapas.map((et, i) => {
    const done = ok.has(et.id); let cls = '';
    if (done) cls = 'done'; else if (!achou) { cls = 'atual'; achou = true; }
    return `<div class="step ${cls}"><div class="n">Etapa ${i + 1}${done ? ' · concluída' : ''}</div><div class="t">${esc(et.nome)}</div></div>`;
  }).join('')}</div>`;
}
function cardPendencias(pend, podeMarcar) {
  return `<div class="card"><h2>O que falta você me enviar</h2><p class="desc">Material que preciso pra continuar a produção.</p>
    ${pend.length ? pend.map(p => `<div class="item-lista"><div class="txt">${esc(p.item)}<small>pedido em ${esc(new Date(p.pedido_em).toLocaleDateString('pt-BR'))}</small></div>
      ${podeMarcar ? `<button class="btn btn-sm" data-act="pend-enviado" data-id="${p.id}">Marquei como enviado</button>` : ''}</div>`).join('')
      : '<div class="vazio">Nenhuma pendência agora.</div>'}</div>`;
}
ACT['pend-enviado'] = async el => {
  await ocupado(el, async () => { const { error } = await sb.from('cli_materiais_pendentes').update({ status: 'recebido', recebido_em: new Date().toISOString() }).eq('id', el.dataset.id); if (error) throw error; });
  toast('Avisei o Igor.'); await carregarNotifs(); await render();
};

async function vInicio(ctx) {
  const cli = await getCliente(ctx.clienteId);
  if (!cli) throw new Error('Mentorado não encontrado.');
  const ro = ctx.modo === 'preview', hoje = hojeISO();
  const [prog, ativ, posts, planos, pend] = await Promise.all([
    q(sb.from('cli_progresso').select('*').eq('cliente_id', cli.id)),
    q(sb.from('cli_atividades_diarias').select('*').eq('cliente_id', cli.id).eq('data', hoje).limit(1)),
    q(sb.from('cli_posts').select('id,titulo,status,versao,data_prevista,enviado_em,texto').eq('cliente_id', cli.id).order('id', { ascending: false }).limit(60)),
    q(sb.from('cli_planos').select('*').eq('cliente_id', cli.id).eq('status', 'ativo')),
    q(sb.from('cli_materiais_pendentes').select('*').eq('cliente_id', cli.id).eq('status', 'pendente').order('pedido_em')),
  ]);
  const plano = planos[0] || null;
  const itens = plano ? await q(sb.from('cli_plano_itens').select('*').eq('plano_id', plano.id).order('fase_ordem').order('ordem').order('id')) : [];

  // 1) o que exige ação AGORA (é o que traz o mentorado de volta ao portal)
  const aprovados = posts.filter(p => p.status === 'aprovado'), ajustes = posts.filter(p => p.status === 'ajustes');
  const atencao = [
    ...aprovados.map(p => `<div class="card destaque"><div class="row-between"><div><span class="chip aprovado">Aprovado</span><h2 style="margin-top:8px">${esc(p.titulo || 'Post sem título')}</h2>
      <p class="desc" style="margin:2px 0 0">Está liberado. Publique no LinkedIn e cole o link aqui pra fechar o checklist do dia.</p></div>
      <a class="btn btn-primary" href="${lnkPost(ctx, p.id)}">Publicar e colar o link</a></div></div>`),
    ...ajustes.map(p => `<div class="card alerta"><div class="row-between"><div><span class="chip ajustes">Ajustes pedidos</span><h2 style="margin-top:8px">${esc(p.titulo || 'Post sem título')}</h2>
      <p class="desc" style="margin:2px 0 0">O Igor deixou comentários. Ajuste e envie de novo.</p></div>
      <a class="btn btn-warn" href="${lnkPost(ctx, p.id)}">Ver o que pediram</a></div></div>`),
  ].join('');

  // 2) próximo passo do plano
  const abertos = itens.filter(i => !i.concluido), feitos = itens.length - abertos.length;
  const prox = abertos[0];
  const planoCard = plano ? `<div class="card"><div class="row-between"><h2>Seu plano de ação</h2><a class="btn-link" href="${lnk(ctx, 'plano')}">ver plano completo</a></div>
    <div class="row" style="margin:10px 0 12px;gap:14px"><div class="plano-pct">${itens.length ? Math.round(feitos / itens.length * 100) : 0}%</div>
      <div style="flex:1;min-width:140px"><div class="bar"><i style="width:${itens.length ? feitos / itens.length * 100 : 0}%"></i></div><div class="hint">${feitos} de ${itens.length} itens concluídos</div></div></div>
    ${prox ? `<div class="item-lista" style="border-top:1px solid var(--grid)"><div class="txt"><small style="margin:0 0 2px;color:var(--accent-deep);font-weight:800;text-transform:uppercase;letter-spacing:.05em;font-size:.66rem">Próximo passo · ${esc(prox.fase)}</small>${esc(prox.titulo)}${prox.prazo ? `<small>${chipPrazoTxt(prox.prazo)}</small>` : ''}</div>
      ${ro ? '' : `<button class="btn btn-sm" data-act="item-marcar" data-id="${prox.id}" data-v="1" data-volta="inicio">Marcar como feito</button>`}</div>` : '<div class="vazio" style="padding:8px 0">Tudo concluído. Hora de falar com o Igor sobre o próximo plano.</div>'}</div>`
    : `<div class="card"><h2>Seu plano de ação</h2><div class="vazio">Seu plano de ação ainda está sendo montado. Assim que ficar pronto, ele aparece aqui.</div></div>`;

  // 3) posts
  const cont = s => posts.filter(p => p.status === s).length;
  const postsCard = `<div class="card"><div class="row-between"><h2>Seus posts</h2>${ro ? '' : `<a class="btn btn-primary btn-sm" href="${lnk(ctx, 'posts/novo')}">Novo post</a>`}</div>
    <div class="row" style="margin:12px 0 4px">${['aguardando', 'aprovado', 'ajustes', 'publicado'].map(s => `<span class="chip ${s}">${cont(s)} ${ST[s].toLowerCase()}</span>`).join('')}</div>
    ${posts.slice(0, 3).map(p => `<a class="item-lista clicavel" style="text-decoration:none;color:inherit" href="${lnkPost(ctx, p.id)}"><div class="txt">${esc(p.titulo || (p.texto || '').split('\n')[0].slice(0, 70) || 'Sem título')}</div>${chipSt(p.status)}</a>`).join('')
      || '<div class="vazio">Você ainda não enviou nenhum post. Escreva o primeiro e mande pra aprovação.</div>'}
    ${posts.length > 3 ? `<div style="margin-top:8px"><a class="btn-link" href="${lnk(ctx, 'posts')}">ver todos os posts</a></div>` : ''}</div>`;

  return {
    kicker: [cli.empresa, cli.nivel].filter(Boolean).join(' · ') || 'Seu portal',
    titulo: `Olá, ${primeiroNome(cli.nome)}`,
    html: `${renderStepper(prog)}${atencao}
      <div class="card"><div class="row-between"><div><h2>Checklist de hoje</h2><p class="desc" style="margin-bottom:12px">${esc(fmtDiaSem(hoje))} · três coisas por dia: conectar, postar e comentar.</p></div>
      <a class="btn-link" href="${lnk(ctx, 'calendario')}">ver calendário</a></div>
      ${formChecklist(hoje, ativ[0], cli, { auto: !ro, somenteLeitura: ro })}</div>
      ${planoCard}${postsCard}${cardPendencias(pend, !ro)}`,
  };
}

/* =====================================================================
   CALENDÁRIO
   ===================================================================== */
let CAL = { ano: new Date().getFullYear(), mes: new Date().getMonth() };
const MESES = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];
ACT['cal-nav'] = el => {
  let m = CAL.mes + Number(el.dataset.d), a = CAL.ano;
  if (m < 0) { m = 11; a--; } if (m > 11) { m = 0; a++; }
  CAL = { ano: a, mes: m }; render();
};
async function calendarioHtml(ctx) {
  const cli = await getCliente(ctx.clienteId);
  const ini = isoLocal(new Date(CAL.ano, CAL.mes, 1)), fim = isoLocal(new Date(CAL.ano, CAL.mes + 1, 0));
  const [ativ, posts] = await Promise.all([
    q(sb.from('cli_atividades_diarias').select('*').eq('cliente_id', cli.id).gte('data', ini).lte('data', fim)),
    paginado(() => sb.from('cli_posts').select('id,titulo,status,data_prevista,publicado_em').eq('cliente_id', cli.id).order('id')),
  ]);
  const mapa = {}; ativ.forEach(a => { mapa[a.data] = a; });
  const postsDia = {};
  posts.forEach(p => {
    const dia = p.status === 'publicado' && p.publicado_em ? isoLocal(new Date(p.publicado_em)) : p.data_prevista;
    if (dia && dia >= ini && dia <= fim) (postsDia[dia] = postsDia[dia] || []).push(p);
  });
  const primeiro = new Date(CAL.ano, CAL.mes, 1), offset = (primeiro.getDay() + 6) % 7, ultimo = new Date(CAL.ano, CAL.mes + 1, 0).getDate();
  const hoje = hojeISO();
  let cel = '';
  for (let i = 0; i < offset; i++) cel += '<div class="cal-dia fora"></div>';
  for (let d = 1; d <= ultimo; d++) {
    const iso = `${CAL.ano}-${pad(CAL.mes + 1)}-${pad(d)}`, st = statusAtividade(mapa[iso], cli), ps = postsDia[iso] || [];
    const pontos = ps.slice(0, 3).map(p => `<span class="pt ${p.status === 'aprovado' ? 'ap' : p.status === 'aguardando' ? 'ag' : ''}" style="left:calc(50% + ${(ps.slice(0, 3).indexOf(p) - (Math.min(ps.length, 3) - 1) / 2) * 10}px - 3px)"></span>`).join('');
    cel += `<button class="cal-dia ${st !== 'vazio' ? st : ''} ${iso === hoje ? 'hoje' : ''}" data-act="dia-abrir" data-dia="${iso}" aria-label="${esc(fmtDiaSem(iso))}${ps.length ? ', com post' : ''}">${d}${pontos}</button>`;
  }
  CAL._posts = postsDia; CAL._ativ = mapa;
  return `<div class="cal-nav"><button class="btn btn-sm" data-act="cal-nav" data-d="-1" aria-label="Mês anterior">‹</button>
    <strong style="text-transform:capitalize">${MESES[CAL.mes]} de ${CAL.ano}</strong><button class="btn btn-sm" data-act="cal-nav" data-d="1" aria-label="Próximo mês">›</button></div>
    <div class="cal-grid">${['Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb', 'Dom'].map(x => `<div class="cal-dow">${x}</div>`).join('')}${cel}</div>
    <div class="legenda"><span><i style="background:var(--accent-wash);border:1px solid rgba(12,163,12,.4)"></i>checklist completo</span><span><i style="background:var(--st-aguardando-bg)"></i>parcial</span>
    <span><i style="background:var(--field-bg)"></i>vazio</span><span><i style="background:var(--st-publicado-tx);border-radius:50%"></i>post publicado</span><span><i style="background:var(--accent-deep);border-radius:50%"></i>aprovado</span><span><i style="background:#c98400;border-radius:50%"></i>aguardando</span></div>`;
}

const ST = { rascunho: 'Rascunho', aguardando: 'Aguardando aprovação', ajustes: 'Ajustes pedidos', aprovado: 'Aprovado', reprovado: 'Não aprovado', publicado: 'Publicado' };
const chipSt = s => `<span class="chip ${s}">${esc(ST[s] || s)}</span>`;
const LIMITE_POST = 3000, GANCHO = 210;
const postTitulo = p => p.titulo || (p.texto || '').split('\n').find(l => l.trim())?.slice(0, 70) || 'Sem título';
async function rpc(fn, args) { const { data, error } = await sb.rpc(fn, args); if (error) throw error; return data; }
const carregarPost = async id => (await q(sb.from('cli_posts').select('*').eq('id', id).limit(1)))[0] || null;
const safeNome = n => n.normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^\w.\-]+/g, '_').slice(-90);

// upload por XHR (o supabase-js não expõe progresso); mesmo endpoint e mesma RLS do storage.upload
async function uploadXHR(path, file, onProg) {
  const { data: { session } } = await sb.auth.getSession();
  return new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest();
    xhr.open('POST', `${SUPABASE_URL}/storage/v1/object/${BUCKET}/${path.split('/').map(encodeURIComponent).join('/')}`);
    xhr.setRequestHeader('Authorization', 'Bearer ' + session.access_token);
    xhr.setRequestHeader('apikey', SUPABASE_KEY);
    xhr.setRequestHeader('x-upsert', 'false');
    xhr.setRequestHeader('Content-Type', file.type || 'application/octet-stream');
    xhr.upload.onprogress = e => { if (e.lengthComputable && onProg) onProg(e.loaded / e.total); };
    xhr.onload = () => { if (xhr.status < 300) return resolve(); let m = 'Falha no envio'; try { m = JSON.parse(xhr.responseText).message || m; } catch (e) { /* ok */ } reject(new Error(m)); };
    xhr.onerror = () => reject(new Error('Sem conexão durante o envio.'));
    xhr.send(file);
  });
}
async function urlAssinada(path, seg = 300) { const { data, error } = await sb.storage.from(BUCKET).createSignedUrl(path, seg); if (error) throw error; return data.signedUrl; }
const ehImagem = a => /^image\//.test(a.mime || '');

async function vPosts(ctx) {
  const a0 = ctx.args[0];
  if (a0 === 'novo' && ctx.modo === 'cliente') return editorPost(ctx, null);
  if (a0 && a0 !== 'novo') {
    const p = await carregarPost(a0);
    if (!p) throw new Error('Post não encontrado.');
    if (ctx.modo === 'cliente' && (p.status === 'rascunho' || p.status === 'ajustes')) return editorPost(ctx, p);

}

  return `<div class="anexos">${arquivos.map(a => `<div class="anexo">
    <div class="thumb" data-thumb="${esc(a.path)}" data-img="${ehImagem(a) ? 1 : 0}">${esc((a.nome.split('.').pop() || 'ARQ').slice(0, 4).toUpperCase())}</div>
    <div class="nm" title="${esc(a.nome)}">${esc(a.nome)}</div><div class="tam">${esc(fmtBytes(a.tamanho))}</div>
    <button class="ic-btn" data-act="anexo-abrir" data-path="${esc(a.path)}" title="Abrir" aria-label="Abrir ${esc(a.nome)}">${svg('olho', 16)}</button>
    ${podeRemover ? `<button class="ic-btn" data-act="anexo-remover" data-id="${a.id}" data-path="${esc(a.path)}" title="Remover" aria-label="Remover ${esc(a.nome)}">${svg('lixo', 16)}</button>` : ''}</div>`).join('')}</div>`;
}
async function carregarThumbs() {
  const imgs = $$('.thumb[data-img="1"]'); if (!imgs.length) return;
  const { data } = await sb.storage.from(BUCKET).createSignedUrls(imgs.map(i => i.dataset.thumb), 600);
  (data || []).forEach(r => { const el = imgs.find(i => i.dataset.thumb === r.path); if (el && r.signedUrl) el.innerHTML = `<img src="${esc(r.signedUrl)}" alt="" style="width:44px;height:44px;border-radius:8px;object-fit:cover">`; });
}
ACT['anexo-abrir'] = async el => window.open(await urlAssinada(el.dataset.path), '_blank', 'noopener');

function threadHtml(eventos, p, ctx, nomeCli) {
  const souAdmin = ctx.modo === 'admin';
  if (!eventos.length) return '<div class="vazio">Sem mensagens ainda.</div>';
  return `<div class="thread">${eventos.map(e => {
    const quando = esc(new Date(e.criado_em).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }));
    const quem = e.autor_papel === 'admin' ? (souAdmin ? 'Você' : 'Igor') : (souAdmin ? esc(primeiroNome(nomeCli)) : 'Você');
    if (e.tipo === 'envio') return `<div class="msg sistema">Enviado para aprovação · versão ${e.versao} · ${quando}
      ${e.versao < p.versao || p.status !== 'aguardando' ? `<details style="text-align:left;margin-top:6px"><summary style="cursor:pointer;font-weight:700">ver o texto desta versão</summary><div class="msg" style="margin-top:6px;font-size:.84rem">${esc(e.texto || '')}</div></details>` : ''}</div>`;
    if (e.tipo === 'publicacao') return `<div class="msg sistema">Publicado em ${quando}${urlSegura(e.texto) ? ` · <a href="${esc(urlSegura(e.texto))}" target="_blank" rel="noopener noreferrer">ver no LinkedIn</a>` : ''}</div>`;
    const rot = { aprovacao: 'Aprovou', ajuste: 'Pediu ajustes', reprovacao: 'Não aprovou', comentario: '' }[e.tipo] || '';
    const cls = e.tipo === 'ajuste' ? 'ajuste' : e.tipo === 'reprovacao' ? 'reprov' : e.autor_papel === 'admin' ? 'admin' : '';
    return `<div class="msg ${cls}"><div class="quem">${quem}${rot ? ` · ${rot}` : ''} · ${quando}</div>${e.texto ? esc(e.texto) : '<i class="muted">sem comentário</i>'}</div>`;
  }).join('')}</div>`;
}

async function editorPost(ctx, p) {
  const eventos = p ? await q(sb.from('cli_post_eventos').select('*').eq('post_id', p.id).order('id')) : [];
  const anexos = p ? await q(sb.from('cli_arquivos').select('*').eq('post_id', p.id).order('id')) : [];

  const faixa = p && p.status === 'ajustes' ? `<div class="faixa-status ajustes"><div><b>O Igor pediu ajustes</b>${ult && ult.texto ? esc(ult.texto) : 'Veja os comentários ao lado, ajuste o texto e envie de novo.'}</div></div>` : '';
  return {
    kicker: p ? `Versão ${p.versao}${p.status === 'ajustes' ? ' · ajustes pedidos' : ' · rascunho'}` : 'Novo post', titulo: p ? postTitulo(p) : 'Novo post', refrescavel: false,
    html: `<div style="margin-bottom:12px"><a class="btn-link" href="${lnk(ctx, 'posts')}">← voltar para os posts</a></div>${faixa}
      <div class="post-layout"><div class="card" style="margin:0"><input type="hidden" id="p-id" value="${p ? p.id : ''}">
        <div class="campo"><label class="lbl" for="p-titulo">Título (só pra você se achar; opcional)</label><input type="text" id="p-titulo" maxlength="120" value="${esc(p ? p.titulo || '' : '')}"></div>
        <div class="campo"><label class="lbl" for="p-texto">Texto do post</label><textarea id="p-texto" rows="14" placeholder="Escreva o post aqui…">${esc(p ? p.texto : '')}</textarea><div class="contador" id="p-contador"></div></div>
        <div class="gancho"><small>Gancho · o que aparece antes do “ver mais”</small><span id="p-gancho"></span></div>
        <div class="campo"><label class="lbl" for="p-data">Quando quer publicar? (opcional)</label><input type="date" id="p-data" value="${esc(p ? p.data_prevista || '' : '')}" style="max-width:220px"></div>
        <div class="campo"><label class="lbl">Anexos</label>
          <label class="btn btn-sm" style="cursor:pointer">${svg('clip', 16)} Adicionar arquivo<input type="file" id="p-arquivos" multiple hidden data-chg="post-anexar" accept="image/*,application/pdf,video/*"></label>
          <span class="hint" id="p-envio" style="margin-left:8px"></span><div id="p-anexos">${anexosHtml(anexos, true)}</div></div>
        <div class="row" style="margin-top:6px"><button class="btn" data-act="post-rascunho">Salvar rascunho</button>
          <button class="btn btn-primary" data-act="post-enviar">Enviar para aprovação</button>
          ${p && p.status === 'rascunho' ? '<button class="btn btn-danger btn-sm" data-act="post-excluir" style="margin-left:auto">Excluir rascunho</button>' : ''}</div></div>
      <div class="stack">${eventos.length ? `<div class="card" style="margin:0"><h2 style="margin-bottom:10px">Conversa</h2>${threadHtml(eventos, p, ctx)}</div>` : ''}
        <div class="card" style="margin:0"><h2>Antes de enviar</h2><ul style="margin:8px 0 0;padding-left:18px;color:var(--text-secondary);font-size:.86rem;line-height:1.6">
          <li>As primeiras ${GANCHO} letras decidem se alguém clica em “ver mais”.</li><li>Carrossel? Anexe o PDF. Imagem? Anexe a imagem.</li><li>Depois de enviar você só edita se o Igor pedir ajustes.</li></ul></div></div></div>`,
    depois: () => { atualizarContador(); carregarThumbs(); },
  };
}
ACT['post-rascunho'] = async el => { await ocupado(el, gravarRascunho); toast('Rascunho salvo.'); };
ACT['post-enviar'] = async el => {
  if (!$('#p-texto').value.trim()) { toast('Escreva o texto do post antes de enviar.', true); $('#p-texto').focus(); return; }
  if ($('#p-texto').value.length > LIMITE_POST && !confirm('O texto passa de 3.000 caracteres, que é o limite do LinkedIn. Enviar mesmo assim?')) return;
  if (!confirm('Enviar pra aprovação? Depois de enviar você só edita se o Igor pedir ajustes.')) return;
  await ocupado(el, async () => { const id = await gravarRascunho(); await rpc('cli_post_enviar', { p_id: id }); ir(`posts/${id}`); });
  toast('Enviado! O Igor foi avisado.'); carregarNotifs();
};
ACT['post-excluir'] = async el => {
  if (!confirm('Excluir este rascunho?')) return;
  const ax = await q(sb.from('cli_arquivos').select('path').eq('post_id', Number($('#p-id').value)));
  if (ax.length) await sb.storage.from(BUCKET).remove(ax.map(a => a.path));
  await rpc('cli_post_excluir', { p_id: Number($('#p-id').value) });
  toast('Rascunho excluído.'); ir('posts');
};
CHG['post-anexar'] = async el => {
  const files = [...el.files]; el.value = ''; if (!files.length) return;
  const cli = S.ctx.clienteId, st = $('#p-envio'); const id = await gravarRascunho();
  for (const [i, f] of files.entries()) {
    if (f.size > 50 * 1048576) { toast(`${f.name} passa de 50 MB.`, true); continue; }
    const path = `${cli}/posts/${id}/${Date.now()}_${safeNome(f.name)}`;
    st.textContent = `Enviando ${i + 1}/${files.length}: 0%`;
    await uploadXHR(path, f, pr => { st.textContent = `Enviando ${i + 1}/${files.length}: ${Math.round(pr * 100)}%`; });
    const { error } = await sb.from('cli_arquivos').insert({ cliente_id: cli, pasta: 'Posts', nome: f.name, path, tamanho: f.size, mime: f.type || null, post_id: id });
    if (error) { await sb.storage.from(BUCKET).remove([path]); throw error; }
  }
  st.textContent = ''; await refazerAnexos(); toast('Anexo adicionado.');
};

/* ---------- detalhe (mentorado após enviar · admin revisando) ---------- */
async function detalhePost(ctx, p) {
  const admin = ctx.modo === 'admin', ro = ctx.modo === 'preview';
  const [eventos, anexos, cli] = await Promise.all([
    q(sb.from('cli_post_eventos').select('*').eq('post_id', p.id).order('id')),
    q(sb.from('cli_arquivos').select('*').eq('post_id', p.id).order('id')),
    getCliente(p.cliente_id)]);
  const ult = [...eventos].reverse().find(e => e.autor_papel === 'admin' && ['ajuste', 'reprovacao', 'aprovacao'].includes(e.tipo));
  const nome = cli ? cli.nome : 'Mentorado';
  const F = {
    aguardando: admin ? ['Aguardando sua decisão', `Enviado ${tempoAtras(p.enviado_em)} · versão ${p.versao}`] : ['Aguardando aprovação', 'O Igor vai olhar e responder. Você recebe o aviso aqui no portal.'],
    ajustes: admin ? ['Aguardando o mentorado ajustar', ult && ult.texto || ''] : ['Ajustes pedidos', ult && ult.texto || ''],
    aprovado: admin ? ['Aprovado', 'Aguardando o mentorado publicar.'] : ['Aprovado: pode publicar', 'Publique no LinkedIn e cole o link abaixo pra fechar o checklist do dia.'],
    reprovado: ['Não foi aprovado', ult && ult.texto || ''],
    publicado: ['Publicado', p.post_link ? '' : 'Sem link registrado.'],
    rascunho: ['Rascunho', ''],
  }[p.status];
  const faixa = `<div class="faixa-status ${p.status}"><div><b>${esc(F[0])}</b>${esc(F[1])}${p.status === 'publicado' && urlSegura(p.post_link) ? `<a href="${esc(urlSegura(p.post_link))}" target="_blank" rel="noopener noreferrer">${esc(p.post_link)}</a>` : ''}</div></div>`;

  const publicar = !admin && p.status === 'aprovado' ? `<div class="card destaque"><h2>Já publicou?</h2><p class="desc">Cole o link do post no LinkedIn. Isso fecha o item “post” do seu checklist de hoje.</p>
    <form data-sub="post-publicar"><input type="hidden" name="id" value="${p.id}"><div class="row"><input type="url" name="link" placeholder="https://www.linkedin.com/posts/…" style="flex:1;min-width:220px" ${ro ? 'disabled' : ''}>
    <button class="btn btn-primary" type="submit" ${ro ? 'disabled' : ''}>Marcar como publicado</button></div></form></div>` : '';

  const decidir = admin && p.status === 'aguardando' ? `<div class="decisao"><h2>Sua decisão</h2>
    <label class="lbl" for="dec-texto" style="margin-top:8px">Comentário pro mentorado (obrigatório se pedir ajustes ou não aprovar)</label>
    <textarea id="dec-texto" rows="4" placeholder="O que está bom, o que precisa mudar…"></textarea>
    <div class="botoes"><button class="btn btn-primary" data-act="post-decidir" data-id="${p.id}" data-dec="aprovado">Aprovar</button>
    <button class="btn btn-warn" data-act="post-decidir" data-id="${p.id}" data-dec="ajustes">Pedir ajustes</button>
    <button class="btn btn-danger" data-act="post-decidir" data-id="${p.id}" data-dec="reprovado">Não aprovar</button></div></div>` : '';

  const comentar = !ro ? `<form data-sub="post-comentar" style="margin-top:12px"><input type="hidden" name="id" value="${p.id}">
    <label class="lbl" for="cm-texto">${admin ? 'Mandar uma mensagem' : 'Escrever pro Igor'}</label><textarea id="cm-texto" name="texto" rows="2" placeholder="Escreva aqui…"></textarea>
    <button class="btn btn-sm" type="submit" style="margin-top:8px">Enviar mensagem</button></form>` : '';

  return {
    kicker: admin ? `${nome}${p.versao > 1 ? ` · versão ${p.versao}` : ''}` : `Versão ${p.versao}`, titulo: postTitulo(p), refrescavel: true,
    html: `<div style="margin-bottom:12px"><a class="btn-link" href="${admin ? '#/admin/aprovacoes' : lnk(ctx, 'posts')}">← ${admin ? 'voltar para aprovações' : 'voltar para os posts'}</a>
      ${admin && cli ? ` · <a class="btn-link" href="#/admin/mentorado/${cli.id}">ver ${esc(primeiroNome(cli.nome))}</a>` : ''}</div>${faixa}
      <div class="post-layout"><div class="stack">
        ${p.texto.length > GANCHO ? `<div class="gancho"><small>Gancho · aparece antes do “ver mais”</small>${esc(p.texto.slice(0, GANCHO))}${p.texto.length > GANCHO ? '…' : ''}</div>` : ''}
        <div class="post-corpo">${esc(p.texto) || '<i class="muted">Sem texto.</i>'}</div>
        <div class="row" style="font-size:.8rem;color:var(--muted)"><span>${p.texto.length.toLocaleString('pt-BR')} caracteres</span>${p.data_prevista ? `<span>· previsto para ${esc(fmtData(p.data_prevista))}</span>` : ''}</div>
        ${anexos.length ? `<div><h3 style="margin-bottom:6px">Anexos</h3>${anexosHtml(anexos, false)}</div>` : ''}${publicar}</div>
      <div class="stack">${decidir}<div class="card" style="margin:0"><h2 style="margin-bottom:10px">Conversa</h2>${threadHtml(eventos, p, ctx, nome)}${comentar}</div></div></div>`,
    depois: carregarThumbs,
  };
}

  toast('Publicado! Seu checklist de hoje foi atualizado.'); await carregarNotifs(); await render();

/* =====================================================================
   PLANO DE AÇÃO — o plano E o checklist são o mesmo objeto.
   Modelo = cli_planos com cliente_id null. Mentorado só marca (RPC); admin edita.
   ===================================================================== */
function prazoInfo(prazo, feito) {
  if (!prazo) return null; const h = hojeISO();
  if (feito) return { cls: 'neutro sem-dot', txt: `prazo ${fmtCurta(prazo)}` };
  if (prazo < h) return { cls: 'critico', txt: `atrasado · ${fmtCurta(prazo)}` };
  if (prazo === h) return { cls: 'alerta', txt: 'para hoje' };
  return { cls: 'neutro sem-dot', txt: `até ${fmtCurta(prazo)}` };
}
const chipPrazoTxt = prazo => { const i = prazoInfo(prazo, false); return i ? esc(i.txt) : ''; };
const cmpItem = (a, b) => a.fase_ordem - b.fase_ordem || a.ordem - b.ordem || a.id - b.id;
let PLANO = { plano: null, itens: [] };      // plano em edição/visualização na tela atual
const FASES_FECHADAS = new Set();

function agruparFases(itens) {
  const m = new Map();
  [...itens].sort(cmpItem).forEach(i => {
    const k = i.fase_ordem + '|' + i.fase;
    if (!m.has(k)) m.set(k, { nome: i.fase, ordem: i.fase_ordem, itens: [] });
    m.get(k).itens.push(i);
  });
  return [...m.values()];
}
function itemHtml(i, o) {
  const pz = o.modelo ? (i.prazo_dias != null ? { cls: 'neutro sem-dot', txt: `dia ${i.prazo_dias}` } : null) : prazoInfo(i.prazo, i.concluido);
  return `<div class="pi ${i.concluido ? 'feito' : ''}" data-item="${i.id}">
    <div class="ck">${o.modelo ? '<span style="display:block;width:8px;height:8px;border-radius:50%;background:var(--grid);margin:7px 6px"></span>'
      : `<input type="checkbox" ${i.concluido ? 'checked' : ''} data-chg="item-marcar" data-id="${i.id}" ${o.ro ? 'disabled' : ''} aria-label="Concluir: ${esc(i.titulo)}">`}</div>
    <div class="tx"><div class="tt">${esc(i.titulo)}</div>${i.descricao ? `<div class="ds">${esc(i.descricao)}</div>` : ''}
      ${i.concluido && i.concluido_em ? `<div class="hint">concluído em ${esc(fmtData(isoLocal(new Date(i.concluido_em))))}</div>` : ''}</div>
    <div class="lado">${pz ? `<span class="chip ${pz.cls}">${esc(pz.txt)}</span>` : ''}
      ${o.editavel ? `<div class="acoes-ed"><button class="ic-btn" data-act="item-mover" data-id="${i.id}" data-d="-1" title="Subir" aria-label="Subir item">${svg('cima', 16)}</button>
      <button class="ic-btn" data-act="item-mover" data-id="${i.id}" data-d="1" title="Descer" aria-label="Descer item">${svg('baixo', 16)}</button>
      <button class="ic-btn" data-act="item-editar" data-id="${i.id}" title="Editar" aria-label="Editar item">${svg('editar', 16)}</button>
      <button class="ic-btn" data-act="item-excluir" data-id="${i.id}" title="Excluir" aria-label="Excluir item">${svg('lixo', 16)}</button></div>` : ''}</div></div>`;
}
function faseHtml(f, o, aberta) {
  const feitos = f.itens.filter(i => i.concluido).length;
  const nf = esc(f.nome);
  return `<section class="fase ${aberta ? 'aberta' : ''}" data-fase="${nf}">
    <div class="fase-cab"><button class="fase-tg" data-act="fase-toggle" aria-expanded="${aberta}"><span class="seta">${svg('seta', 16)}</span><span class="fn">${nf}</span>
      <span class="fp">${o.modelo ? `${f.itens.length} ${f.itens.length === 1 ? 'item' : 'itens'}` : `${feitos}/${f.itens.length}`}</span></button>
      ${o.editavel ? `<div class="acoes-ed"><button class="ic-btn" data-act="fase-mover" data-fase="${nf}" data-d="-1" title="Subir fase" aria-label="Subir fase">${svg('cima', 16)}</button>
      <button class="ic-btn" data-act="fase-mover" data-fase="${nf}" data-d="1" title="Descer fase" aria-label="Descer fase">${svg('baixo', 16)}</button>
      <button class="ic-btn" data-act="fase-renomear" data-fase="${nf}" title="Renomear fase" aria-label="Renomear fase">${svg('editar', 16)}</button>
      <button class="ic-btn" data-act="fase-excluir" data-fase="${nf}" title="Excluir fase" aria-label="Excluir fase">${svg('lixo', 16)}</button></div>` : ''}</div>
    <div class="fase-corpo">${f.itens.map(i => itemHtml(i, o)).join('')}
      ${o.editavel ? `<div style="padding:10px 0 4px"><button class="btn btn-sm" data-act="item-novo" data-fase="${nf}">${svg('mais', 14)} Adicionar item nesta fase</button></div>` : ''}</div></section>`;
}
function planoDocHtml(plano, itens, o) {
  const fases = agruparFases(itens), total = itens.length, feitos = itens.filter(i => i.concluido).length;
  const pct = total ? Math.round(feitos / total * 100) : 0, hoje = hojeISO();
  const atras = itens.filter(i => !i.concluido && i.prazo && i.prazo < hoje).length;
  const primeiraPend = fases.findIndex(f => f.itens.some(i => !i.concluido));
  const periodo = plano.inicio ? `${fmtData(plano.inicio)}${plano.fim ? ' a ' + fmtData(plano.fim) : ''}` : '';
  return `<div class="card"><div class="row-between"><div><div class="kicker">${o.modelo ? 'Modelo de plano' : 'Plano de ação'}</div><h2 style="font-size:1.2rem;margin-top:2px">${esc(plano.titulo)}</h2>
      ${plano.objetivo ? `<p class="sec" style="margin-top:4px;max-width:640px;white-space:pre-wrap">${esc(plano.objetivo)}</p>` : ''}${periodo ? `<p class="hint">${esc(periodo)}</p>` : ''}</div>
      ${o.editavel ? `<button class="btn btn-sm" data-act="plano-meta">${svg('editar', 15)} Editar dados do plano</button>` : ''}</div>
    ${o.modelo ? '' : `<div class="plano-topo" style="margin-top:16px"><div class="plano-pct" id="plano-pct">${pct}%</div>
      <div style="flex:1;min-width:180px"><div class="bar"><i id="plano-bar" style="width:${pct}%"></i></div><div class="hint" id="plano-cont">${feitos} de ${total} itens concluídos</div></div>
      ${atras ? `<span class="chip critico" id="plano-atras">${atras} ${atras === 1 ? 'atrasado' : 'atrasados'}</span>` : '<span id="plano-atras"></span>'}</div>`}</div>
    ${fases.length ? fases.map((f, k) => faseHtml(f, o, FASES_FECHADAS.has(f.nome) ? false : (o.modelo || o.editavel ? true : k === Math.max(0, primeiraPend)))).join('')
      : '<div class="card"><div class="vazio">Plano vazio.</div></div>'}
    ${o.editavel ? `<div style="margin:6px 0 16px"><button class="btn" data-act="item-novo" data-fase="">${svg('mais', 15)} Adicionar nova fase</button></div>` : ''}`;
}
ACT['fase-toggle'] = el => {
  const s = el.closest('.fase'), nome = s.dataset.fase; s.classList.toggle('aberta');
  el.setAttribute('aria-expanded', s.classList.contains('aberta'));

};

/* ---------- marcar item (mentorado) ---------- */
function recalcPlanoDOM() {
  const todos = $$('.pi input[data-chg="item-marcar"]'), feitos = todos.filter(c => c.checked).length, total = todos.length;

  set('plano-pct', e => { e.textContent = pct + '%'; }); set('plano-bar', e => { e.style.width = pct + '%'; });
  set('plano-cont', e => { e.textContent = `${feitos} de ${total} itens concluídos`; });
  $$('.fase').forEach(s => { const cs = $$('input[data-chg="item-marcar"]', s); const fp = $('.fp', s); if (fp) fp.textContent = `${cs.filter(c => c.checked).length}/${cs.length}`; });
}

/* ---------- conteúdo do plano (mentorado, preview e aba do admin) ---------- */
async function carregarPlanoAtivo(clienteId) {
  const planos = await q(sb.from('cli_planos').select('*').eq('cliente_id', clienteId).order('id', { ascending: false }));
  const plano = planos.find(p => p.status === 'ativo') || null;
  const itens = plano ? await q(sb.from('cli_plano_itens').select('*').eq('plano_id', plano.id).order('fase_ordem').order('ordem').order('id')) : [];
  return { plano, itens, arquivados: planos.filter(p => p.status === 'arquivado') };
}
async function planoConteudo(ctx) {
  const admin = ctx.modo === 'admin', ro = ctx.modo === 'preview';
  const { plano, itens, arquivados } = await carregarPlanoAtivo(ctx.clienteId);
  PLANO = { plano, itens };
  if (!plano) {
    if (!admin) return '<div class="card"><div class="vazio"><b>Seu plano de ação ainda está sendo montado.</b><br>Assim que ficar pronto, ele aparece aqui com o checklist de cada passo.</div></div>';

      + arquivadosHtml(arquivados);

  const barra = admin ? `<div class="row" style="margin-bottom:14px"><button class="btn btn-sm" data-act="plano-trocar">Trocar por outro modelo</button>

    const { error } = await sb.from('cli_plano_itens').update(campos).eq('id', id); if (error) throw error;
  } else {
    campos.plano_id = PLANO.plano.id; campos.ordem = itens.filter(i => i.fase === fase).reduce((m, i) => Math.max(m, i.ordem), 0) + 1;

  }

async function gravarOrdens(updates) {

/* =====================================================================
   DRIVE POR MENTORADO — estilo Google Drive (porte do "Arquivos" do painel).
   Binário no bucket PRIVADO cli-drive ({cliente_id}/...); metadados em cli_arquivos.
   Pasta é uma coluna de texto (subpasta = "A/B"). Pasta vazia só vive no navegador de quem criou.
   ===================================================================== */
const PASTAS_PADRAO = ['Plano de ação', 'Posts', 'Materiais de isca', 'Gravações', 'Outros'];
let DR = { cli: null, arquivos: [], caminho: '', vista: lsGet('drive-vista') || 'grade', busca: '', ro: false, urls: {}, menu: null };

const semAcento = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const extDe = n => (/\.([a-z0-9]{1,5})$/i.exec(n || '') || [, ''])[1].toLowerCase();
function corExt(ext, mime) {
  if (ext === 'pdf') return '#d03b3b';
  if (/^image\//.test(mime || '') || ['png', 'jpg', 'jpeg', 'gif', 'webp', 'svg'].includes(ext)) return '#2a78d6';
  if (/^video\//.test(mime || '') || ['mp4', 'mov', 'webm', 'mkv'].includes(ext)) return '#4a3aa7';
  if (['xls', 'xlsx', 'csv'].includes(ext)) return '#1a8f4a';
  if (['doc', 'docx', 'txt', 'md'].includes(ext)) return '#2a6fd6';
  if (['ppt', 'pptx', 'key'].includes(ext)) return '#eb6834';
  return '#7a7872';
}
const icoArq = a => { const e = extDe(a.nome); return `<span class="dr-ico" style="--c:${corExt(e, a.mime)}">${esc((e || 'arq').slice(0, 4).toUpperCase())}</span>`; };
const ehImg = a => /^image\//.test(a.mime || '') || ['png', 'jpg', 'jpeg', 'gif', 'webp'].includes(extDe(a.nome));
const pastasVazias = () => { try { return new Set(JSON.parse(lsGet('drive-pastas-' + DR.cli) || '[]')); } catch (e) { return new Set(); } };
const gravarVazias = set => lsSet('drive-pastas-' + DR.cli, JSON.stringify([...set]));
function addPrefixos(s, caminho) { const p = caminho.split('/'); for (let i = 1; i <= p.length; i++) s.add(p.slice(0, i).join('/')); }
function todasPastas() {
  const s = new Set(PASTAS_PADRAO);
  DR.arquivos.forEach(a => { if (a.pasta) addPrefixos(s, a.pasta); });
  pastasVazias().forEach(p => addPrefixos(s, p));
  return s;
}
function filhasDe(caminho) {
  const pref = caminho ? caminho + '/' : '', out = [];
  todasPastas().forEach(p => { if (p.startsWith(pref) && p !== caminho && !p.slice(pref.length).includes('/')) out.push(p); });
  return out.sort((a, b) => a.localeCompare(b, 'pt-BR'));
}
const dentroDe = (a, p) => a.pasta === p || a.pasta.startsWith(p + '/');
const contar = p => DR.arquivos.filter(a => dentroDe(a, p)).length;
const nomePasta = p => p.split('/').pop();

async function carregarDrive() {
  DR.arquivos = await paginado(() => sb.from('cli_arquivos').select('*').eq('cliente_id', DR.cli).order('id'));
}
async function vDrive(ctx) {
  DR.cli = ctx.clienteId; DR.ro = ctx.modo === 'preview'; DR.caminho = ''; DR.busca = '';
  await carregarDrive();
  return { kicker: 'Seus arquivos', titulo: 'Drive', refrescavel: false, html: '<div id="drive-root"></div>', depois: desenharDrive };
}
async function driveConteudo(ctx) {   // aba "Drive" do admin
  DR.cli = ctx.clienteId; DR.ro = false; DR.caminho = ''; DR.busca = '';
  await carregarDrive(); return '<div id="drive-root"></div>';
}

function desenharDrive() {
  const root = $('#drive-root'); if (!root) return;
  const busca = semAcento(DR.busca.trim());
  const partes = DR.caminho ? DR.caminho.split('/') : [];

    partes.map((n, i) => { const p = partes.slice(0, i + 1).join('/'); return `<span class="dr-sep">/</span><button class="dr-crumb ${i === partes.length - 1 ? 'atual' : ''}" data-act="dr-ir" data-p="${esc(p)}" data-drop="${esc(p)}">${esc(n)}</button>`; }).join('') + '</nav>';

  let corpo = '';
  if (busca) {
    const achados = DR.arquivos.filter(a => semAcento(a.nome).includes(busca));
    corpo = `<div class="dr-sub">${achados.length} ${achados.length === 1 ? 'resultado' : 'resultados'} para “${esc(DR.busca)}”</div>` + (achados.length ? arquivosHtml(achados, true) : '<div class="vazio">Nada encontrado.</div>');
  } else {

    corpo = (pastas.length ? `<div class="dr-sub">Pastas</div><div class="dr-pastas">${pastas.map(p => `<div class="dr-pasta" data-drop="${esc(p)}" data-act="dr-ir" data-p="${esc(p)}" tabindex="0" role="button">
      ${svg('drive', 26)}<div class="dr-pn"><div class="dr-nome">${esc(nomePasta(p))}</div><div class="dr-qt">${contar(p)} ${contar(p) === 1 ? 'arquivo' : 'arquivos'}</div></div>

  }
  root.innerHTML = `<div class="dr-doc" data-drop="${esc(DR.caminho)}">
