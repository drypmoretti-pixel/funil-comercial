      <input type="search" class="dr-busca" id="dr-busca" placeholder="Buscar nos seus arquivos" value="${esc(DR.busca)}" aria-label="Buscar arquivos">
      <div class="dr-vistas" role="group" aria-label="Modo de exibição"><button class="${DR.vista === 'grade' ? 'ativa' : ''}" data-act="dr-vista" data-v="grade" aria-label="Grade">▦</button><button class="${DR.vista === 'lista' ? 'ativa' : ''}" data-act="dr-vista" data-v="lista" aria-label="Lista">☰</button></div></div>
    ${crumbs}${corpo}<input type="file" id="dr-file" multiple hidden data-chg="dr-upload"></div>`;
  const b = $('#dr-busca');
  b.oninput = () => { DR.busca = b.value; const pos = b.selectionStart; desenharDrive(); const nb = $('#dr-busca'); nb.focus(); nb.setSelectionRange(pos, pos); };
  carregarMiniaturas();
}
function arquivosHtml(arqs, comPasta) {
  const acoes = a => DR.ro ? '' : `<button class="ic-btn" data-act="dr-menu" data-tipo="arq" data-id="${a.id}" aria-label="Opções de ${esc(a.nome)}">⋮</button>`;
  const arrasta = a => DR.ro ? '' : `draggable="true" data-fid="${a.id}"`;
  if (DR.vista === 'lista') return `<div class="dr-tabela"><div class="dr-linha cab"><span>Nome</span><span>Enviado</span><span>Tamanho</span><span></span></div>${arqs.map(a => `<div class="dr-linha" ${arrasta(a)}>
    <button class="dr-nomecel" data-act="dr-abrir" data-id="${a.id}">${icoArq(a)}<span class="dr-nome">${esc(a.nome)}${comPasta && a.pasta ? `<small>${esc(a.pasta)}</small>` : ''}</span></button>
    <span class="dr-meta">${esc(fmtData(isoLocal(new Date(a.created_at))))}</span><span class="dr-meta">${esc(fmtBytes(a.tamanho))}</span>${acoes(a)}</div>`).join('')}</div>`;
  return `<div class="dr-grade">${arqs.map(a => `<div class="dr-card" ${arrasta(a)}>

    <div class="dr-pe"><div class="dr-nome" title="${esc(a.nome)}">${esc(a.nome)}${comPasta && a.pasta ? `<small>${esc(a.pasta)}</small>` : ''}</div>${acoes(a)}</div></div>`).join('')}</div>`;
}
async function carregarMiniaturas() {
  const alvos = $$('.dr-thumb[data-img="1"]'); if (!alvos.length) return;
  const arq = id => DR.arquivos.find(a => a.id === Number(id));
  const faltam = alvos.map(el => arq(el.dataset.id)).filter(a => a && !DR.urls[a.path]);

/* ---------- upload (botão e arrastar do computador) ---------- */
function painelEnvio() {
  let p = $('#dr-envio'); if (!p) { p = document.createElement('div'); p.id = 'dr-envio'; p.className = 'dr-envio'; document.body.appendChild(p); } return p;
}
async function enviarArquivos(files, pasta) {
  if (DR.ro) return; const lista = [...files]; if (!lista.length) return;
  const p = painelEnvio(); p.classList.add('aberto');
  p.innerHTML = `<div class="dr-envio-topo"><b>Enviando ${lista.length} ${lista.length === 1 ? 'arquivo' : 'arquivos'}</b><button class="ic-btn" data-act="dr-envio-fechar" aria-label="Fechar">✕</button></div><div class="dr-envio-lista">${lista.map((f, i) => `<div class="dr-env-item" id="env-${i}"><div class="dr-env-linha"><span>${esc(f.name)}</span><span>0%</span></div><div class="bar fina"><i style="width:0"></i></div></div>`).join('')}</div>`;
  for (const [i, f] of lista.entries()) {
    const item = $('#env-' + i), pct = item.querySelector('.dr-env-linha span:last-child'), barra = item.querySelector('.bar i');
    if (f.size > 50 * 1048576) { pct.textContent = 'passa de 50 MB'; item.classList.add('erro'); continue; }
    const path = `${DR.cli}/${(pasta ? safeNome(pasta.replace(/\//g, '_')) : 'raiz')}/${Date.now()}_${safeNome(f.name)}`;
    try {
      await uploadXHR(path, f, pr => { pct.textContent = Math.round(pr * 100) + '%'; barra.style.width = pr * 100 + '%'; });
      const { error } = await sb.from('cli_arquivos').insert({ cliente_id: DR.cli, pasta: pasta || '', nome: f.name, path, tamanho: f.size, mime: f.type || null });
      if (error) { await sb.storage.from(BUCKET).remove([path]); throw error; }
      pct.textContent = 'ok ✓'; item.classList.add('ok');
    } catch (e) { pct.textContent = 'erro'; item.classList.add('erro'); toast(`${f.name}: ${msgErro(e)}`, true); }
  }
  await carregarDrive(); desenharDrive(); setTimeout(() => ACT['dr-envio-fechar'](), 2500);
}
ACT['dr-envio-fechar'] = () => { const p = $('#dr-envio'); if (p) { p.classList.remove('aberto'); p.innerHTML = ''; } };
CHG['dr-upload'] = el => { const fs = [...el.files]; el.value = ''; return enviarArquivos(fs, DR.caminho); };

/* ---------- arrastar: arquivo → pasta, e arquivo do computador → drive ---------- */
let arrastando = null;
document.addEventListener('dragstart', ev => { const c = ev.target.closest && ev.target.closest('[data-fid]'); if (c) { arrastando = Number(c.dataset.fid); ev.dataTransfer.effectAllowed = 'move'; ev.dataTransfer.setData('text/plain', String(arrastando)); } });
document.addEventListener('dragend', () => { arrastando = null; $$('.dr-alvo').forEach(e => e.classList.remove('dr-alvo')); });
document.addEventListener('dragover', ev => {
  const z = ev.target.closest && ev.target.closest('[data-drop]'); if (!z || !$('#drive-root') || DR.ro) return;
  ev.preventDefault(); $$('.dr-alvo').forEach(e => e.classList.remove('dr-alvo')); z.classList.add('dr-alvo');
});
document.addEventListener('drop', async ev => {
  const z = ev.target.closest && ev.target.closest('[data-drop]'); if (!z || !$('#drive-root') || DR.ro) return;
  ev.preventDefault(); $$('.dr-alvo').forEach(e => e.classList.remove('dr-alvo'));
  const destino = z.dataset.drop;
  try {
    if (arrastando != null) { const id = arrastando; arrastando = null; await moverArquivo(id, destino); }
    else if (ev.dataTransfer.files && ev.dataTransfer.files.length) await enviarArquivos(ev.dataTransfer.files, destino);
  } catch (e) { erroAcao(e); }
});

      <div class="campo"><label class="lbl" for="ec-nivel">Nível / plano</label><input type="text" id="ec-nivel" value="${esc(cli.nivel || '')}"></div>
      <div class="campo"><label class="lbl" for="ec-status">Status</label><select id="ec-status">${['ativo', 'pausado', 'encerrado'].map(s => `<option value="${s}" ${cli.status === s ? 'selected' : ''}>${s[0].toUpperCase() + s.slice(1)}</option>`).join('')}</select></div>
      <div class="campo"><label class="lbl" for="ec-meta">Posts por semana</label><input type="number" id="ec-meta" min="1" max="7" value="${cli.meta_semanal || 4}"></div><div class="campo"><label class="lbl" for="ec-con">Conexões por dia</label><input type="number" id="ec-con" min="0" value="${cli.meta_conexoes || 5}"></div>
      <div class="campo"><label class="lbl" for="ec-cmin">Comentários por dia (mín)</label><input type="number" id="ec-cmin" min="0" value="${cli.meta_comentarios_min || 5}"></div><div class="campo"><label class="lbl" for="ec-cmax">Comentários por dia (máx)</label><input type="number" id="ec-cmax" min="0" value="${cli.meta_comentarios_max || 10}"></div></div>
      <button class="btn btn-primary btn-sm" type="submit">Salvar</button></form></div>
    <div class="card"><h2>Pendências de material</h2><p class="desc">O que o mentorado precisa te enviar.</p>
      ${pend.length ? pend.map(p => `<div class="item-lista"><div class="txt">${esc(p.item)}<small>pedido em ${esc(new Date(p.pedido_em).toLocaleDateString('pt-BR'))}</small></div><button class="btn btn-sm" data-act="pend-recebido" data-id="${p.id}">Marcar recebido</button></div>`).join('') : '<div class="vazio">Nenhuma pendência aberta.</div>'}
      <form data-sub="pend-nova" class="row" style="margin-top:12px"><input type="text" id="np-item" placeholder="Ex: print do SSI atualizado" required style="flex:1;min-width:200px"><button class="btn btn-primary btn-sm" type="submit">Adicionar</button></form></div>`;
}
SUB['mentorado-editar'] = async () => {
  const { error } = await sb.from('cli_clientes').update({ nome: $('#ec-nome').value.trim(), empresa: $('#ec-empresa').value.trim() || null, nivel: $('#ec-nivel').value.trim() || null, status: $('#ec-status').value,
    meta_semanal: parseInt($('#ec-meta').value) || 4, meta_conexoes: parseInt($('#ec-con').value) || 5, meta_comentarios_min: parseInt($('#ec-cmin').value) || 5, meta_comentarios_max: parseInt($('#ec-cmax').value) || 10 }).eq('id', S.ctx.clienteId);
  if (error) throw error; await clientes(true); toast('Salvo.'); await render();
};
ACT['etapa-concluir'] = async el => {
  const { error } = await sb.from('cli_progresso').upsert({ cliente_id: S.ctx.clienteId, etapa_id: Number(el.dataset.et), concluida_em: new Date().toISOString() }, { onConflict: 'cliente_id,etapa_id' });
  if (error) throw error; await render();
};
SUB['pend-nova'] = async () => {
  const { error } = await sb.from('cli_materiais_pendentes').insert({ cliente_id: S.ctx.clienteId, item: $('#np-item').value.trim() }); if (error) throw error; await render();
};
ACT['pend-recebido'] = async el => {
  const { error } = await sb.from('cli_materiais_pendentes').update({ status: 'recebido', recebido_em: new Date().toISOString() }).eq('id', el.dataset.id); if (error) throw error; await render();
};

/* ---------- acesso: criar login / resetar senha ---------- */
function mensagemBoasVindas(nome, email, senha) {
  return `Oi, ${primeiroNome(nome)}! Seu acesso ao portal da mentoria Demanda Infinita está pronto.\n\nLink: ${PORTAL_URL}\nE-mail: ${email}\nSenha: ${senha}\n\nLá você acompanha seu plano de ação, manda seus posts pra aprovação e guarda seus arquivos. Quando entrar, pode trocar a senha pelo menu no canto superior direito.`;
}
async function acessoConteudo(cli) {
  const [perfis, acs] = await Promise.all([q(sb.from('cli_perfis').select('id,created_at').eq('cliente_id', cli.id).eq('role', 'cliente')), acessos()]);
  const ac = acs ? acs.find(a => a.cliente_id === cli.id) : null;
  if (!perfis.length) return `<div class="card"><h2>Este mentorado ainda não tem login</h2><p class="desc">O login é criado aqui, sem passar pelo Supabase. A senha aparece uma única vez.</p>
    <div class="campo" style="max-width:420px"><label class="lbl" for="ac-email">E-mail de login (opcional; se vazio, uso nome.sobrenome@mentorados.demandainfinita.com)</label><input type="email" id="ac-email" placeholder="deixe em branco para o padrão"></div>
    <button class="btn btn-primary" data-act="acesso-criar">Gerar acesso</button></div>`;
  return `<div class="card"><h2>Acesso ao portal</h2><div class="stack" style="margin-top:8px"><div><span class="muted">E-mail de login:</span> <b>${esc(ac ? ac.email : '—')}</b></div>
    <div><span class="muted">Último acesso:</span> <b>${ac && ac.ultimo_login ? esc(new Date(ac.ultimo_login).toLocaleString('pt-BR')) + ' (' + esc(tempoAtras(ac.ultimo_login)) + ')' : 'nunca entrou'}</b></div></div>
    <p class="desc" style="margin-top:14px">Esqueceu ou quer reenviar? Gerar nova senha invalida a anterior.</p><button class="btn" data-act="acesso-resetar">${svg('chave', 16)} Gerar nova senha</button></div>`;
}
function modalCredenciais(r) {
  const msg = mensagemBoasVindas(r.nome, r.email, r.senha);
  abrirModal('Acesso gerado', `<p class="desc">Copie agora: <b>a senha não fica salva em lugar nenhum</b> e não aparece de novo.</p><textarea id="cred-msg" rows="9" readonly>${esc(msg)}</textarea>
    <div class="row" style="margin-top:10px"><button class="btn btn-primary" data-act="copiar" data-alvo="cred-msg">Copiar mensagem</button></div>`);
}
async function copiarTexto(t) {
  try { await navigator.clipboard.writeText(t); return true; }
  catch (e) { const ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select(); const ok = document.execCommand && document.execCommand('copy'); ta.remove(); return !!ok; }
}
ACT['copiar'] = async el => { const alvo = $('#' + el.dataset.alvo); if (await copiarTexto(alvo.value)) toast('Copiado.'); else { alvo.select(); toast('Selecione e copie (Ctrl/Cmd+C).', true); } };
ACT['acesso-criar'] = async el => {
  const email = ($('#ac-email').value || '').trim();
  const r = await ocupado(el, () => fnAdmin({ acao: 'criar_login', cliente_id: S.ctx.clienteId, email: email || undefined }));
  modalCredenciais(r); render();
};
ACT['acesso-resetar'] = async el => {
  if (!confirm('Gerar uma nova senha? A senha atual deixa de funcionar.')) return;
  const r = await ocupado(el, () => fnAdmin({ acao: 'resetar_senha', cliente_id: S.ctx.clienteId }));
  modalCredenciais(r);
};

/* ---------- lançamento: gerar acessos em lote ---------- */
let LANC = null;
async function vLancamento() {
  const [cls, perfis, acs] = await Promise.all([clientes(true), q(sb.from('cli_perfis').select('cliente_id').eq('role', 'cliente').not('cliente_id', 'is', null)), acessos()]);
  const comLogin = new Set(perfis.map(p => p.cliente_id));
  const linhas = cls.map(c => { const ac = acs ? acs.find(a => a.cliente_id === c.id) : null;
    return `<label class="item-lista" style="cursor:pointer"><span class="row" style="gap:12px"><input type="checkbox" class="lanc-ck" value="${c.id}" ${c.status === 'ativo' ? 'checked' : ''}><span class="txt">${esc(c.nome)}<small>${esc(c.empresa || '')}${c.status !== 'ativo' ? ' · ' + esc(c.status) : ''}</small></span></span>
      <span class="chip ${comLogin.has(c.id) ? (ac && ac.ultimo_login ? 'ok' : 'alerta') : 'neutro'}">${comLogin.has(c.id) ? (ac && ac.ultimo_login ? 'já entrou' : 'nunca entrou') : 'sem login'}</span></label>`; }).join('');
  return { kicker: 'Lançamento', titulo: 'Gerar acessos', refrescavel: false,
    html: `<div style="margin-bottom:12px"><a class="btn-link" href="#/admin/mentorados">← voltar aos mentorados</a></div>
      <div class="card alerta"><h2>Antes de gerar</h2><p class="desc" style="margin:4px 0 0">Quem já tem login ganha <b>senha nova</b> (a antiga para de funcionar). Quem não tem, ganha login. As senhas aparecem <b>uma única vez</b>, nesta tela, com a mensagem pronta pra você copiar e mandar.</p></div>
      <div class="card"><div class="row-between"><h2>Quem recebe</h2><div class="row"><button class="btn-link" data-act="lanc-todos" data-v="1">marcar todos</button><button class="btn-link" data-act="lanc-todos" data-v="0">desmarcar</button></div></div>${linhas}
      <div style="margin-top:14px"><button class="btn btn-primary" data-act="lanc-gerar">Gerar acessos dos marcados</button></div></div><div id="lanc-saida"></div>` };
}
ACT['lanc-todos'] = el => $$('.lanc-ck').forEach(c => { c.checked = el.dataset.v === '1'; });
ACT['lanc-gerar'] = async el => {
  const ids = $$('.lanc-ck:checked').map(c => Number(c.value)); if (!ids.length) { toast('Marque pelo menos um mentorado.', true); return; }
  if (!confirm(`Gerar acesso para ${ids.length} mentorado${ids.length === 1 ? '' : 's'}? Quem já tem login terá a senha trocada.`)) return;
  const perfis = await q(sb.from('cli_perfis').select('cliente_id').eq('role', 'cliente').not('cliente_id', 'is', null)), tem = new Set(perfis.map(p => p.cliente_id));
  const saida = []; const comSenha = ids.filter(id => tem.has(id)), semLogin = ids.filter(id => !tem.has(id));
  await ocupado(el, async () => {
    if (comSenha.length) (await fnAdmin({ acao: 'resetar_todos', cliente_ids: comSenha })).resultados.forEach(r => saida.push(r));
    for (const id of semLogin) { try { saida.push(await fnAdmin({ acao: 'criar_login', cliente_id: id })); } catch (e) { saida.push({ cliente_id: id, erro: msgErro(e) }); } }
  });
  LANC = saida; const cls = await clientes();
  const nomeDe = id => (cls.find(c => c.id === id) || {}).nome || 'Mentorado';
  $('#lanc-saida').innerHTML = `<div class="card destaque"><div class="row-between"><div><h2>Acessos gerados</h2><p class="desc" style="margin:2px 0 0"><b>Não feche esta tela antes de copiar.</b> As senhas não ficam salvas em lugar nenhum.</p></div>
    <button class="btn btn-primary" data-act="lanc-copiar-tudo">Copiar todas as mensagens</button></div>
    ${saida.map((r, i) => r.erro ? `<div class="item-lista"><div class="txt">${esc(r.nome || nomeDe(r.cliente_id))}<small style="color:var(--critical)">${esc(r.erro)}</small></div></div>`
      : `<div class="item-lista" style="align-items:flex-start"><div class="txt" style="flex:1"><b>${esc(r.nome || nomeDe(r.cliente_id))}</b><small>${esc(r.email)}</small>
         <textarea id="lanc-msg-${i}" rows="6" readonly style="margin-top:8px;font-size:.82rem">${esc(mensagemBoasVindas(r.nome || nomeDe(r.cliente_id), r.email, r.senha))}</textarea></div>
         <button class="btn btn-sm" data-act="copiar" data-alvo="lanc-msg-${i}">Copiar</button></div>`).join('')}</div>`;
  $('#lanc-saida').scrollIntoView({ behavior: 'smooth' });
};
ACT['lanc-copiar-tudo'] = async () => {
  const txt = (LANC || []).filter(r => !r.erro).map(r => `=== ${r.nome} ===\n${mensagemBoasVindas(r.nome, r.email, r.senha)}`).join('\n\n\n');
  if (await copiarTexto(txt)) toast('Todas as mensagens copiadas.'); else toast('Não consegui copiar tudo. Use o botão de cada mentorado.', true);
};

/* =====================================================================
   REGISTRO DE TELAS + partida
   ===================================================================== */
const VIEWS_CLIENTE = { inicio: vInicio, plano: vPlano, posts: vPosts, calendario: vCalendario, drive: vDrive };
const VIEWS_ADMIN = { dashboard: vDashboard, aprovacoes: vAprovacoes, post: vPostAdmin, mentorados: vMentorados, mentorado: vMentorado, modelos: vModelos, modelo: vModelo, lancamento: vLancamento };
boot();

</script>
