<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aprovar mensagem | Demanda Infinita</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="../logo-demanda-infinita.png">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--green:#008E43;--green-soft:#E6F4EC;--bg:#F8F7F4;--white:#fff;--text:#111;--gray:#6B6B6B;--line:#D8D5CE;--warn:#C2410C;--warn-soft:#FDEEE6;--wa:#DCF8C6;}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;font-size:15px;line-height:1.5;}
  h1{font-family:'Plus Jakarta Sans',sans-serif;font-size:20px;margin:0 0 4px;}
  .wrap{max-width:560px;margin:0 auto;padding:20px 16px 60px;}
  .brand{display:flex;align-items:center;gap:10px;margin-bottom:18px;font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;}
  .brand img{width:30px;height:30px;}
  .card{background:var(--white);border:1px solid var(--line);border-radius:14px;padding:18px;}
  .meta{color:var(--gray);font-size:13.5px;margin:2px 0;}
  .meta b{color:var(--text);}
  .msg{background:var(--wa);border-radius:12px;padding:12px 14px;margin:14px 0;white-space:pre-wrap;word-break:break-word;font-size:14.5px;}
  .msg img{display:block;max-width:100%;border-radius:8px;margin-bottom:10px;}
  .acts{display:flex;flex-direction:column;gap:10px;margin-top:16px;}
  button{font:inherit;font-weight:700;border:0;border-radius:12px;padding:14px 16px;cursor:pointer;}
  .ok{background:var(--green);color:#fff;}
  .no{background:#fff;color:var(--warn);border:1px solid #F0C8B4;}
  .all{background:var(--green-soft);color:var(--green);}
  button:disabled{opacity:.5;cursor:default;}
  .st{margin-top:14px;padding:12px 14px;border-radius:12px;font-weight:600;}
  .st.good{background:var(--green-soft);color:var(--green);}
  .st.bad{background:var(--warn-soft);color:var(--warn);}
  .st.info{background:#eee;color:#444;}
  .tag{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;background:#eee;color:#444;}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><img src="../logo-demanda-infinita.png" alt=""> Eventos · Demanda Infinita</div>
  <div class="card" id="c">Carregando…</div>
</div>
<script>
const FN = 'https://okolawlvmfyxzvnnpvtv.supabase.co/functions/v1/evento-envios';
const T = new URLSearchParams(location.search).get('t') || '';
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ROT = { aguardando:'Aguardando sua decisão', aprovado:'Aprovada — vai sair na hora', recusado:'Recusada', cancelado:'Cancelada (já feita à mão)', enviando:'Enviando agora', enviado:'Já enviada', falhou:'Falhou', expirado:'Expirada (passou do horário)', bloqueado:'Bloqueada (falta link)' };
let dados = null;

function quando(iso) {
  const d = new Date(iso);
  return d.toLocaleString('pt-BR', { weekday:'long', day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit', timeZone:'America/Sao_Paulo' });
}

function desenhar(msg, cls) {
  const d = dados;
  const aberta = d.status === 'aguardando';
  $('c').innerHTML = `
    <h1>${esc(d.titulo)}</h1>
    <div class="meta">Sai <b>${esc(quando(d.quando))}</b> (Brasília)</div>
    <div class="meta">Grupos: <b>${esc(d.grupos.join(' · ') || 'nenhum')}</b></div>
    <div class="meta"><span class="tag">${esc(ROT[d.status] || d.status)}</span></div>
    <div class="msg">${d.imagem_url ? `<img src="${esc(d.imagem_url)}" alt="">` : ''}${esc(d.texto)}</div>
    ${aberta ? `<div class="acts">
      <button class="ok" id="b-ok">✅ Aprovar esta mensagem</button>
      <button class="all" id="b-all">✅✅ Aprovar todas as próximas desta edição</button>
      <button class="no" id="b-no">❌ Recusar</button>
    </div>` : ''}
    ${msg ? `<div class="st ${cls}">${esc(msg)}</div>` : ''}
    ${d.erro ? `<div class="st bad">${esc(d.erro)}</div>` : ''}`;
  if (aberta) {
    $('b-ok').onclick = () => decidir('aprovar');
    $('b-all').onclick = () => decidir('aprovar_todas');
    $('b-no').onclick = () => decidir('recusar');
  }
}

async function decidir(decisao) {
  document.querySelectorAll('button').forEach(b => b.disabled = true);
  try {
    const r = await fetch(FN + '?acao=decidir', { method:'POST', headers:{ 'Content-Type':'application/json' }, body: JSON.stringify({ t:T, decisao }) });
    const j = await r.json();
    if (!r.ok) { await carregar(j.erro || 'Não consegui registrar.', 'bad'); return; }
    await carregar(decisao === 'recusar' ? 'Recusada. Não será enviada.' : decisao === 'aprovar_todas' ? `Aprovadas ${j.qtd} mensagens.` : 'Aprovada. Sai sozinha na hora marcada.', decisao === 'recusar' ? 'info' : 'good');
  } catch (e) { await carregar('Sem conexão. Tente de novo.', 'bad'); }
}

async function carregar(msg, cls) {
  try {
    const r = await fetch(FN + '?acao=info&t=' + encodeURIComponent(T));
    if (!r.ok) { $('c').innerHTML = '<h1>Link inválido</h1><div class="meta">Esta mensagem não existe mais ou o link foi trocado. Peça um novo pedido de aprovação.</div>'; return; }
    dados = await r.json();
    desenhar(msg, cls);
  } catch (e) { $('c').textContent = 'Sem conexão. Recarregue a página.'; }
}
carregar();
</script>
</body>
</html>
