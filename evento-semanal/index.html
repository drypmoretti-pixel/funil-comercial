<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Evento Semanal | Demanda Infinita</title>
<meta name="robots" content="noindex">
<link rel="icon" href="../logo-demanda-infinita.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>

  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;font-size:14px;line-height:1.5;}
  h1,h2,h3{font-family:'Plus Jakarta Sans',sans-serif;margin:0;}
  button{font:inherit;cursor:pointer;}
  input{font:inherit;}
  .wrap{max-width:860px;margin:0 auto;padding:0 16px;}
  .mono{font-family:'JetBrains Mono',monospace;}
  .muted{color:var(--gray);}
  .hidden{display:none !important;}

  /* topo */
  .top{background:var(--white);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;}
  .top .wrap{display:flex;align-items:center;gap:10px;height:58px;}
  .top img{width:34px;height:34px;}
  .top .brand{font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:15px;line-height:1.1;}
  .top .brand small{display:block;font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:600;color:var(--green);letter-spacing:1px;text-transform:uppercase;}
  .top .sp{flex:1;}
  .top .who{font-size:12.5px;color:var(--gray);}

  .btn{border:0;border-radius:10px;padding:10px 16px;font-weight:600;font-size:13.5px;background:var(--text);color:#fff;}
  .btn.green{background:var(--green);}
  .btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line);}
  .btn.small{padding:6px 11px;font-size:12.5px;border-radius:8px;}
  .btn.danger{background:transparent;color:var(--warn);border:1px solid #F0C8B4;}
  .btn:disabled{opacity:.5;cursor:default;}
  .link{background:none;border:0;padding:0;color:var(--green);font-weight:600;text-decoration:underline;}

  /* login */
  .login{max-width:380px;margin:12vh auto 0;background:var(--white);border:1px solid var(--line);border-radius:16px;padding:28px 24px;text-align:center;}
  .login img{width:64px;height:64px;margin-bottom:12px;}
  .login h1{font-size:22px;margin-bottom:4px;}
  .login p{color:var(--gray);font-size:13px;margin:0 0 18px;}
  .field{text-align:left;margin-bottom:12px;}
  .field label{display:block;font-size:12px;font-weight:600;margin-bottom:4px;}
  .field input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:14px;}
  .field input:focus{outline:2px solid var(--green);border-color:transparent;}
  .err{color:var(--warn);font-size:12.5px;min-height:18px;margin-top:6px;}

  /* home */
  .head{padding:26px 0 14px;display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;}
  .head h1{font-size:26px;}
  .head .kicker{font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:600;color:var(--green);letter-spacing:1.4px;text-transform:uppercase;margin-bottom:4px;}
  .head .sp{flex:1;}
  .evcard{display:flex;gap:14px;align-items:center;background:var(--white);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px;cursor:pointer;width:100%;text-align:left;}
  .evcard:hover{border-color:var(--green);}
  .evcard .date{flex:0 0 62px;text-align:center;border-radius:10px;background:var(--green-soft);padding:7px 0;}
  .evcard .date b{display:block;font-family:'Plus Jakarta Sans',sans-serif;font-size:22px;line-height:1;color:var(--green);}
  .evcard .date span{font-size:11px;font-weight:600;text-transform:uppercase;color:var(--green);}
  .evcard .info{flex:1;min-width:0;}
  .evcard .t{font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:15px;}
  .evcard .s{font-size:12.5px;color:var(--gray);}
  .bar{height:6px;background:var(--card);border-radius:99px;overflow:hidden;margin-top:7px;}
  .bar i{display:block;height:100%;background:var(--green);border-radius:99px;}
  .evcard.done{opacity:.65;}
  .evcard.done .date{background:var(--card);}
  .evcard.done .date b,.evcard.done .date span{color:var(--gray);}
  .empty{background:var(--white);border:1px dashed var(--line);border-radius:14px;padding:30px 20px;text-align:center;color:var(--gray);}
  .sec-t{font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:600;letter-spacing:1.4px;text-transform:uppercase;color:var(--gray);margin:22px 0 10px;}

  /* evento */
  .back{margin-top:18px;}
  .evhead{background:var(--white);border:1px solid var(--line);border-radius:16px;padding:18px;margin:12px 0;}
  .evhead .row1{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap;}
  .evhead h1{font-size:23px;line-height:1.2;}
  .evhead .tema{font-size:13px;color:var(--gray);margin-top:3px;}
  .pill{display:inline-block;font-family:'JetBrains Mono',monospace;font-size:10.5px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;border-radius:99px;padding:3px 10px;background:var(--green-soft);color:var(--green);}
  .pill.gray{background:var(--card);color:var(--gray);}
  .prog{display:flex;align-items:center;gap:10px;margin-top:14px;font-size:12.5px;color:var(--gray);}
  .prog .bar{flex:1;margin:0;height:8px;}

  .now{border:2px solid var(--green);background:var(--white);border-radius:16px;padding:14px 16px;margin:12px 0;}
  .now .l{font-family:'JetBrains Mono',monospace;font-size:10.5px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;color:var(--green);}
  .now .t{font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:17px;margin:2px 0;}
  .now .s{font-size:13px;color:var(--gray);}
  .now .acts{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;}
  .banner{background:var(--warn-soft);border:1px solid #F0C8B4;border-radius:12px;padding:11px 14px;margin:12px 0;font-size:13px;}
  .banner b{color:var(--warn);}
  .banner .btn{margin-top:8px;}

  details.ficha{background:var(--white);border:1px solid var(--line);border-radius:14px;margin:12px 0;}
  details.ficha summary{list-style:none;padding:13px 16px;cursor:pointer;display:flex;align-items:center;gap:10px;font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;}
  details.ficha summary::-webkit-details-marker{display:none;}
  details.ficha summary .sp{flex:1;}
  details.ficha summary .chev{transition:transform .15s;color:var(--gray);}
  details.ficha[open] summary .chev{transform:rotate(90deg);}
  .ficha-body{padding:0 16px 14px;display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;}
  .ficha-body .field{margin:0;}
  .ficha-body .full{grid-column:1/-1;}
  .saved{font-size:11.5px;color:var(--green);min-height:16px;}
  .miss{font-size:11.5px;color:var(--warn);font-weight:600;}

  .day{margin-top:20px;}
  .day-h{display:flex;align-items:center;gap:9px;margin-bottom:8px;position:sticky;top:58px;background:var(--bg);padding:6px 0;z-index:5;}
  .day-h .dd{font-family:'JetBrains Mono',monospace;font-size:11.5px;font-weight:600;color:#fff;border-radius:7px;padding:3px 9px;}
  .day-h .dn{font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:15px;}
  .day-h .tag{margin-left:auto;}
  .f-margem{background:#8FAE9B;} .f-antecip{background:#3E9E68;} .f-contagem{background:var(--green);} .f-diad{background:var(--text);} .f-pos{background:#6B6B6B;} .f-prep{background:#A8A39A;}

  .item{background:var(--white);border:1px solid var(--line);border-radius:12px;margin-bottom:8px;overflow:hidden;}
  .item .ih{display:flex;align-items:center;gap:11px;padding:11px 13px;}
  .ck{flex:0 0 24px;width:24px;height:24px;border-radius:7px;border:2px solid #B9B4AA;background:#fff;display:flex;align-items:center;justify-content:center;padding:0;}
  .ck svg{width:14px;height:14px;stroke:#fff;stroke-width:3;fill:none;opacity:0;}
  .item.ok .ck{background:var(--green);border-color:var(--green);}
  .item.ok .ck svg{opacity:1;}
  .item .hr{flex:0 0 50px;font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:600;}
  .item .tt{flex:1;min-width:0;}
  .item .tt b{font-weight:600;}
  .item .tt .k{display:inline-block;font-family:'JetBrains Mono',monospace;font-size:9.5px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;border-radius:5px;padding:1px 6px;margin-right:6px;vertical-align:1px;}
  .k.msg{background:var(--green-soft);color:var(--green);}
  .k.acao{background:var(--card);color:var(--text);}
  .item .st{font-size:11px;font-weight:600;white-space:nowrap;}
  .st.late{color:var(--warn);}
  .st.next{color:var(--green);}
  .st.skip{color:var(--gray);}
  .item .tog{background:none;border:0;color:var(--gray);padding:4px;display:flex;}
  .item .tog svg{width:18px;height:18px;transition:transform .15s;}
  .item.open .tog svg{transform:rotate(180deg);}
  .item.ok .tt b{color:var(--gray);text-decoration:line-through;text-decoration-color:#B9B4AA;}
  .item.skipped{opacity:.6;}
  .item.isnext{border:2px solid var(--green);}
  .item.islate{border-color:#F0C8B4;}
  .ib{display:none;border-top:1px solid var(--line);padding:12px 13px;background:#FBFAF8;}
  .item.open .ib{display:block;}
  .msgtext{white-space:pre-wrap;word-break:break-word;background:#fff;border:1px solid var(--line);border-left:4px solid var(--green);border-radius:10px;padding:11px 13px;font-size:13.5px;line-height:1.55;}
  .ph{background:var(--ph);color:var(--ph-text);border-radius:4px;padding:0 4px;font-family:'JetBrains Mono',monospace;font-size:.88em;font-weight:600;}
  .ib .row{display:flex;gap:8px;align-items:center;margin-top:9px;flex-wrap:wrap;}
  .ib .why{font-size:12px;color:var(--gray);margin-top:8px;}
  .ib .desc{font-size:13.5px;}
  .ib ol{margin:6px 0 10px;padding-left:20px;font-size:13.5px;}
  .ib ol li{margin-bottom:4px;}
  .ib h4{font-family:'Plus Jakarta Sans',sans-serif;font-size:13.5px;margin:14px 0 6px;}
  .copyblk{margin-bottom:10px;}
  .copyblk .lb{font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--green);margin-bottom:4px;display:flex;align-items:center;gap:8px;}
  .alert{border-left:4px solid var(--warn);background:var(--warn-soft);border-radius:8px;padding:8px 12px;font-size:12.5px;margin:8px 0;}

  .foot{text-align:center;font-size:12px;color:var(--gray);padding:34px 0 40px;}

  /* modal */
  .ov{position:fixed;inset:0;background:rgba(17,17,17,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50;}
  .modal{background:var(--white);border-radius:16px;padding:22px;width:100%;max-width:440px;max-height:92vh;overflow:auto;}
  .modal h2{font-size:19px;margin-bottom:4px;}
  .modal p{color:var(--gray);font-size:13px;margin:0 0 14px;}
  .modal .g2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .modal .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;}
  .toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--text);color:#fff;border-radius:10px;padding:10px 16px;font-size:13px;z-index:60;box-shadow:0 6px 20px rgba(0,0,0,.2);}

  @media (max-width:600px){
    .ficha-body{grid-template-columns:1fr;}
    .item .hr{flex-basis:44px;font-size:11px;}
    .item .st{display:none;}
    .head h1{font-size:22px;}
    .evhead h1{font-size:20px;}
    .top .who{display:none;}
  }

.editor{border:1px solid var(--line,#d9e2dc);border-radius:10px;padding:12px;background:#fff}
.editor textarea{width:100%;box-sizing:border-box;font:inherit;font-size:14px;line-height:1.5;padding:10px;border:1px solid #cfd8d2;border-radius:8px;resize:vertical;margin:8px 0}
.editor .vars{display:flex;flex-wrap:wrap;gap:6px}
.editor .chip{font:inherit;font-size:12px;padding:3px 9px;border-radius:999px;border:1px solid #cfd8d2;background:#f4f8f5;cursor:pointer}
.editor .chip:hover{background:#e3efe7}
.imgblk{margin-top:8px}.imgblk img{display:block;max-width:100%;max-height:260px;border-radius:8px;border:1px solid #d9e2dc;margin:6px 0}
</style>
</head>

const pad = n => String(n).padStart(2, '0');
function dataLocal(iso) { const [y, m, d] = iso.split('-').map(Number); return new Date(y, m - 1, d); }
function isoDe(dt) { return `${dt.getFullYear()}-${pad(dt.getMonth() + 1)}-${pad(dt.getDate())}`; }
function somaDias(dt, n) { const x = new Date(dt); x.setDate(x.getDate() + n); return x; }
function ddmm(dt) { return `${pad(dt.getDate())}/${pad(dt.getMonth() + 1)}`; }
function fmtHora(dt) { return dt.getMinutes() ? `${dt.getHours()}h${pad(dt.getMinutes())}` : `${dt.getHours()}h`; }

function toast(msg) { const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 2200); }

async function copiar(texto) {
  try { await navigator.clipboard.writeText(texto); }
  catch (e) {
    const ta = document.createElement('textarea'); ta.value = texto; ta.style.position = 'fixed'; ta.style.opacity = '0';

  }

function quandoItem(ev, it) {
  const ini = inicioEvento(ev);
  if (it.rel !== undefined) { const x = somaDias(ini, it.d); x.setMinutes(x.getMinutes() + it.rel); return x; }
  const x = somaDias(dataLocal(ev.data), it.d); const [h, m] = it.t.split(':').map(Number); x.setHours(h, m, 0, 0); return x;
}

function proximaData(ev) {
  const seguinte = eventos.filter(e => e.id !== ev.id && e.data > ev.data).sort((a, b) => a.data.localeCompare(b.data))[0];
  return seguinte ? seguinte : null;
}

function ctx(ev) {
  const ini = inicioEvento(ev);
  const h = m => { const x = new Date(ini); x.setMinutes(x.getMinutes() + m); return fmtHora(x); };
  const seg = proximaData(ev);
  const prox = seg ? inicioEvento(seg) : somaDias(ini, 7);
  return {
    dia: DIAS[ini.getDay()], data: ddmm(ini), hora: fmtHora(ini), h,
    sala: ev.link_sala || '[LINK DA SALA]',
    evento: ev.link_evento || '[LINK DO EVENTO]',
    grupo: ev.link_grupo || '[LINK DO GRUPO]',
    grav: ev.link_gravacao || '',
    proxDia: DIAS[prox.getDay()], proxData: ddmm(prox), proxHora: fmtHora(prox),
  };
}

function ctxModelo() {
  return { dia:'{dia}', data:'{data}', hora:'{hora}', h: m => `{hora${m < 0 ? m : '+' + m}}`,
    sala:'{sala}', evento:'{evento}', grupo:'{grupo}', grav:'{gravacao}',
    proxDia:'{proxDia}', proxData:'{proxData}', proxHora:'{proxHora}' };
}
function modeloOriginal(k) { return MSG[k](ctxModelo()); }
function aplicarModelo(tpl, c) {
  let t = tpl;
  if (!c.grav) t = t.split('\n\n').filter(p => !p.includes('{gravacao}')).join('\n\n');
  return t.replace(/\{hora([+-]\d+)\}/g, (_, m) => c.h(Number(m)))
    .replace(/\{(dia|data|hora|evento|sala|grupo|proxDia|proxData|proxHora)\}/g, (_, n) => c[n])
    .replace(/\{gravacao\}/g, c.grav);
}
function msgTexto(k, c) { return k in textos ? aplicarModelo(textos[k], c) : MSG[k](c); }
function modeloAtual(k) { return k in textos ? textos[k] : modeloOriginal(k); }

async function subirImagem(k, f) {
  if (f.size > 8 * 1024 * 1024) { toast('Imagem acima de 8 MB'); return; }
  toast('Enviando imagem...');
  const ext = (f.name.split('.').pop() || 'png').toLowerCase().replace(/[^a-z0-9]/g, '');
  const path = `${k.replace(/[^a-z0-9+-]/gi, '_')}-${Date.now()}.${ext}`;
  const up = await sb.storage.from('evento-imagens').upload(path, f, { contentType: f.type });
  if (up.error) { toast('Não enviou: ' + up.error.message); return; }
  const url = sb.storage.from('evento-imagens').getPublicUrl(path).data.publicUrl;
  const { error } = await sb.from('evs_textos').upsert({ chave: k, imagem_url: url, imagem_path: path, atualizado_por: eu.id, atualizado_em: new Date().toISOString() });
  if (error) { toast('Não salvou: ' + error.message); return; }
  if (imagens[k]) sb.storage.from('evento-imagens').remove([imagens[k].path]);
  imagens[k] = { url, path };
  renderEvento(false, true); toast('Imagem salva para todas as edições');
}
async function removerImagem(k) {

  if (error) { toast('Não removeu: ' + error.message); return; }
  sb.storage.from('evento-imagens').remove([antigo.path]);
  delete imagens[k];
  renderEvento(false, true);
}
async function copiarImagem(k) {
  try {
    const blob = await (await fetch(imagens[k].url)).blob();
    const bmp = await createImageBitmap(blob);
    const cv = document.createElement('canvas'); cv.width = bmp.width; cv.height = bmp.height;
    cv.getContext('2d').drawImage(bmp, 0, 0);
    const png = await new Promise(r => cv.toBlob(r, 'image/png'));
    await navigator.clipboard.write([new ClipboardItem({ 'image/png': png })]);
    toast('Imagem copiada. Cole no grupo.');
  } catch (e) { toast('Não deu para copiar. Use Baixar.'); }
}
async function baixarImagem(k) {
  const blob = await (await fetch(imagens[k].url)).blob();

}

}

  $('l-err').textContent = '';
  const { error } = await sb.auth.signInWithPassword({ email: $('l-email').value.trim(), password: $('l-senha').value });
  if (error) { $('l-err').textContent = 'E-mail ou senha incorretos.'; return; }
  iniciar();
});
$('btn-sair').onclick = async () => { await sb.auth.signOut(); location.href = location.pathname; };

function mostrar(v) {
  ['login', 'lista', 'evento'].forEach(x => $('v-' + x).classList.toggle('hidden', x !== v));
}

/* ---------- lista ---------- */
async function carregarEventos() {
  const { data, error } = await sb.from('evs_eventos').select('*').order('data', { ascending: true });
  if (error) { toast('Erro ao carregar eventos'); return; }
  eventos = data || [];
  const ids = eventos.map(e => e.id);
  window._contagem = {};
  if (ids.length) {
    const { data: cs } = await sb.from('evs_checks').select('evento_id,chave').in('evento_id', ids);
    (cs || []).forEach(c => { window._contagem[c.evento_id] = (window._contagem[c.evento_id] || 0) + 1; });
  }
}

function cardEvento(ev) {
  const ini = inicioEvento(ev);
  const feitos = Math.min(window._contagem[ev.id] || 0, PLANO.length);
  const pct = Math.round(feitos / PLANO.length * 100);
  const hoje = new Date(); hoje.setHours(0, 0, 0, 0);
  const dias = Math.round((dataLocal(ev.data) - hoje) / 864e5);
  const quando = ev.status === 'concluido' ? 'Concluído' : dias === 0 ? 'É hoje' : dias === 1 ? 'Amanhã' : dias > 1 ? `Faltam ${dias} dias` : `Foi há ${-dias} dia${dias === -1 ? '' : 's'}, falta concluir`;
  return `<button class="evcard ${ev.status === 'concluido' ? 'done' : ''}" onclick="abrirEvento(${ev.id})">
    <div class="date"><b>${pad(ini.getDate())}</b><span>${MESES[ini.getMonth()]}</span></div>
    <div class="info">
      <div class="t">${ev.edicao ? ev.edicao + 'ª edição · ' : ''}${DIAS[ini.getDay()]}, ${ddmm(ini)} às ${fmtHora(ini)}</div>
      <div class="s">${quando} · ${feitos} de ${PLANO.length} etapas</div>
      <div class="bar"><i style="width:${pct}%"></i></div>
    </div></button>`;
}

function mostrarLista(semHistorico) {
  atual = null;
  if (!semHistorico) history.pushState({}, '', location.pathname);
  const ativos = eventos.filter(e => e.status === 'ativo');
  const conc = eventos.filter(e => e.status === 'concluido').reverse();
  $('lista-ativos').innerHTML = ativos.length ? ativos.map(cardEvento).join('')
    : `<div class="empty">Nenhum evento em andamento.<br><br><button class="btn green" onclick="novoEvento()">+ Criar o primeiro</button></div>`;
  $('lista-concluidos').innerHTML = conc.length ? `<div class="sec-t">Concluídos</div>` + conc.slice(0, 12).map(cardEvento).join('') : '';
  mostrar('lista');
  window.scrollTo(0, 0);
}

$('btn-novo').onclick = () => novoEvento();
$('btn-voltar').onclick = async () => { await carregarEventos(); mostrarLista(); };
window.onpopstate = () => { const alvo = Number(new URLSearchParams(location.search).get('e')); alvo ? abrirEvento(alvo, true) : mostrarLista(true); };

/* ---------- criar evento ---------- */
function novoEvento(base) {
  const ultimo = [...eventos].sort((a, b) => b.data.localeCompare(a.data))[0];
  const ref = base || ultimo;
  const sugestao = ref ? isoDe(somaDias(dataLocal(ref.data), 7)) : isoDe(somaDias(new Date(), 10));
  const hora = ref ? ref.hora.slice(0, 5) : '19:00';
  const edicao = ref && ref.edicao ? ref.edicao + 1 : '';
  const sala = ref && ref.link_sala ? ref.link_sala : '';
  $('modal-root').innerHTML = `<div class="ov" onclick="if(event.target===this)fecharModal()"><form class="modal" id="f-novo">
    <h2>${base ? 'Criar a próxima edição' : 'Novo evento'}</h2>
    <p>O plano completo de 10 dias (ações + mensagens) já nasce com as datas certas.</p>
    <div class="g2">
      <div class="field"><label>Data do evento</label><input type="date" id="n-data" value="${sugestao}" required></div>
      <div class="field"><label>Horário (Brasília)</label><input type="time" id="n-hora" value="${hora}" required></div>
    </div>
    <div class="field"><label>Número da edição (opcional)</label><input type="number" min="1" id="n-edicao" value="${edicao}" placeholder="ex: 3"></div>
    <div class="field"><label>Link da sala (opcional, dá para pôr depois)</label><input type="url" id="n-sala" value="${esc(sala)}" placeholder="https://meet.google.com/..."></div>
    <div class="err" id="n-err"></div>
    <div class="acts"><button type="button" class="btn ghost" onclick="fecharModal()">Cancelar</button><button class="btn green" type="submit">Criar evento</button></div>
  </form></div>`;
  $('f-novo').onsubmit = async e => {
    e.preventDefault();
    const data = $('n-data').value;
    if (eventos.some(x => x.data === data && x.status === 'ativo')) { $('n-err').textContent = 'Já existe um evento ativo nessa data.'; return; }
    const linha = { data, hora: $('n-hora').value, edicao: $('n-edicao').value ? Number($('n-edicao').value) : null, link_sala: $('n-sala').value.trim() || null, criado_por: eu.id };
    const { data: novo, error } = await sb.from('evs_eventos').insert(linha).select().single();
    if (error) { $('n-err').textContent = 'Não consegui criar: ' + error.message; return; }
    fecharModal();
    await carregarEventos();
    abrirEvento(novo.id);
  };
}
function fecharModal() { $('modal-root').innerHTML = ''; }

/* ---------- tela do evento ---------- */
async function abrirEvento(id, semHistorico) {
  atual = eventos.find(e => e.id === id);
  if (!atual) return mostrarLista();
  if (!semHistorico) history.pushState({}, '', '?e=' + id);
  const { data } = await sb.from('evs_checks').select('*').eq('evento_id', id);
  checks = {};
  (data || []).forEach(c => { checks[c.chave] = c; });
  abertos = new Set();
  renderEvento(true);
  mostrar('evento');
}

function itensDoEvento(ev) {
  return PLANO.map(it => ({ ...it, quando: quandoItem(ev, it) })).sort((a, b) => a.quando - b.quando);
}

function renderEvento(rolarParaHoje, manterFicha) {
  const ev = atual;
  const c = ctx(ev);
  const ini = inicioEvento(ev);
  const itens = itensDoEvento(ev);
  const agora = new Date();
  const feitos = itens.filter(i => checks[i.k]).length;
  const pend = itens.filter(i => !checks[i.k]);
  const proximo = pend[0];
  const atrasadosMsg = itens.filter(i => i.tipo === 'msg' && !checks[i.k] && i.quando < agora && !mesmoDia(i.quando, agora));
  const nenhumaMsgFeita = !itens.some(i => i.tipo === 'msg' && checks[i.k]);
  const concluido = ev.status === 'concluido';

  if (rolarParaHoje && proximo && !concluido) abertos.add(proximo.k);

  let h = `<div class="evhead">
    <div class="row1"><div style="flex:1;min-width:220px">
      <span class="pill ${concluido ? 'gray' : ''}">${concluido ? 'Concluído' : 'Em andamento'}${ev.edicao ? ' · ' + ev.edicao + 'ª edição' : ''}</span>
      <h1 style="margin-top:8px">${c.dia[0].toUpperCase() + c.dia.slice(1)}, ${c.data} às ${c.hora}</h1>
      <div class="tema">${esc(TEMA)}</div></div>
      ${concluido ? `<button class="btn ghost small" onclick="reabrir()">Reabrir</button>` : `<button class="btn small" onclick="concluir()">Concluir evento</button>`}
    </div>
    <div class="prog"><div class="bar"><i style="width:${Math.round(feitos / itens.length * 100)}%"></i></div><span>${feitos} de ${itens.length}</span></div>
  </div>`;

  if (!concluido && proximo) {
    const ehAtraso = proximo.quando < agora;
    h += `<div class="now"><div class="l">${ehAtraso ? 'Próximo passo · já passou do horário' : 'Próximo passo'}</div>
      <div class="t">${esc(proximo.tit)}</div>
      <div class="s">${DIAS[proximo.quando.getDay()]}, ${ddmm(proximo.quando)} às ${fmtHora(proximo.quando)} · ${proximo.tipo === 'msg' ? 'mensagem no grupo' : 'ação do time'}</div>
      <div class="acts">${proximo.tipo === 'msg' ? `<button class="btn green small" onclick="copiarMsg('${proximo.k}')">Copiar mensagem</button>` : ''}
      <button class="btn ghost small" onclick="irPara('${proximo.k}')">Ver no plano</button>
      <button class="btn ghost small" onclick="marcar('${proximo.k}')">Marcar como feito</button></div></div>`;
  } else if (!concluido && !proximo) {
    h += `<div class="now"><div class="l">Tudo feito</div><div class="t">Plano completo. Pode concluir o evento.</div><div class="acts"><button class="btn green small" onclick="concluir()">Concluir e criar a próxima edição</button></div></div>`;
  }

  if (!concluido && atrasadosMsg.length && nenhumaMsgFeita) {
    h += `<div class="banner"><b>${atrasadosMsg.length} mensage${atrasadosMsg.length > 1 ? 'ns ficaram' : 'm ficou'} para trás</b> porque o evento foi criado com menos de 10 dias. Não mande duas no mesmo dia para recuperar: pule as que passaram e siga a partir de hoje.<br>
      <button class="btn small" onclick="pularPassadas()">Pular as que já passaram</button></div>`;
  }

  const campos = [
    ['link_evento', 'Link do evento no LinkedIn', 'https://www.linkedin.com/events/...'],
    ['link_sala', 'Link da sala (enviado 5 min antes)', 'https://meet.google.com/...'],
    ['link_grupo', 'Link do grupo de WhatsApp', 'https://chat.whatsapp.com/...'],
    ['link_gravacao', 'Link da gravação (depois do evento)', 'https://youtu.be/...'],
  ];
  const faltam = campos.filter(([k]) => k !== 'link_gravacao' && !ev[k]).length;
  const resumoFicha = faltam ? `<span class="miss">${faltam} link${faltam > 1 ? 's' : ''} faltando</span>` : '<span class="saved">completa</span>';
  const topo = h;
  h = '';
  h += `<details class="ficha" ${faltam && !concluido ? 'open' : ''}><summary>Ficha da edição <span class="sp"></span><span id="ficha-resumo">${resumoFicha}</span><span class="chev">›</span></summary>
    <div class="ficha-body">
      <div class="field"><label>Data</label><input type="date" value="${ev.data}" onchange="salvarCampo('data', this.value)"></div>
      <div class="field"><label>Horário (Brasília)</label><input type="time" value="${ev.hora.slice(0, 5)}" onchange="salvarCampo('hora', this.value)"></div>
      ${campos.map(([k, l, ph]) => `<div class="field full"><label>${l}</label><input type="url" value="${esc(ev[k] || '')}" placeholder="${ph}" onchange="salvarCampo('${k}', this.value)"></div>`).join('')}
      <div class="field"><label>Edição</label><input type="number" min="1" value="${ev.edicao || ''}" onchange="salvarCampo('edicao', this.value)"></div>
      <div class="field" style="display:flex;align-items:flex-end;justify-content:flex-end"><button class="btn danger small" onclick="excluirEvento()">Excluir evento</button></div>
      <div class="saved full" id="ficha-msg"></div>
    </div></details>`;
  const ficha = h;
  h = '';

  // agrupa por dia
  const grupos = [];
  itens.forEach(it => {
    const chave = isoDe(it.quando);
    let g = grupos.find(x => x.chave === chave);
    if (!g) { g = { chave, d: it.d, data: it.quando, itens: [] }; grupos.push(g); }
    g.itens.push(it);
  });

  grupos.forEach(g => {
    const [cls, nomeFase] = fase(g.d);
    const cod = g.d === 0 ? 'DIA D' : (g.d > 0 ? 'D+' + g.d : 'D' + g.d);
    const ehHoje = mesmoDia(g.data, agora);
    h += `<div class="day" id="dia-${g.chave}"><div class="day-h"><span class="dd ${cls}">${cod}</span><span class="dn">${DIAS[g.data.getDay()]}, ${ddmm(g.data)}</span>
      <span class="tag">${ehHoje ? '<span class="pill">Hoje</span>' : `<span class="muted" style="font-size:12px">${nomeFase}</span>`}</span></div>`;
    g.itens.forEach(it => { h += renderItem(it, c, proximo, agora); });
    h += `</div>`;
  });

  if (manterFicha && $('ev-ficha')) {
    $('ev-top').innerHTML = topo;
    $('ficha-resumo').innerHTML = resumoFicha;
    $('ev-plano').innerHTML = h;
  } else {
    $('ev').innerHTML = `<div id="ev-top">${topo}</div><div id="ev-ficha">${ficha}</div><div id="ev-plano">${h}</div>`;
  }
  if (rolarParaHoje && proximo && !concluido) {
    const alvo = document.getElementById('it-' + proximo.k);
    if (alvo && itens.indexOf(proximo) > 2) setTimeout(() => alvo.scrollIntoView({ block: 'center' }), 50);
  }
}

function renderItem(it, c, proximo, agora) {
  const ck = checks[it.k];
  const pulado = ck && ck.pulado;
  const ok = ck && !pulado;
  const late = !ck && it.quando < agora;
  const isNext = proximo && proximo.k === it.k;
  const aberto = abertos.has(it.k);
  let st = '';
  if (pulado) st = '<span class="st skip">pulada</span>';
  else if (ok) { const p = perfis.find(x => x.id === ck.feito_por); st = `<span class="st skip">${p ? esc(p.nome) : 'feito'}</span>`; }
  else if (isNext) st = '<span class="st next">próximo</span>';
  else if (late) st = '<span class="st late">atrasado</span>';

  let corpo = '';
  if (it.tipo === 'msg') {
    const texto = msgTexto(it.k, c);
    const custom = it.k in textos;
    corpo = (editando.has(it.k) ? editorMsg(it.k) : blocoCopia('Mensagem para o grupo' + (custom ? ' · personalizada' : ''), texto)
      + `<div class="row" style="margin-top:6px"><button class="btn ghost small" onclick="abrirEdicao('${it.k}')">Editar texto</button></div>`)
      + blocoImagem(it.k) + `<div class="why">${esc(WHY[it.k] || '')}</div>`;
  } else {
    corpo = (it.desc ? `<div class="desc">${esc(it.desc)}</div>` : '') + guia(atual, it, c);
  }
  corpo += `<div class="row">${it.tipo === 'msg' ? `<button class="btn green small" onclick="copiarMsg('${it.k}')">Copiar mensagem</button>` : ''}
    ${ck ? `<button class="btn ghost small" onclick="desmarcar('${it.k}')">${pulado ? 'Desfazer pulo' : 'Desmarcar'}</button>`
         : `<button class="btn ghost small" onclick="marcar('${it.k}')">Marcar como feito</button>${it.tipo === 'msg' ? `<button class="btn ghost small" onclick="marcar('${it.k}', true)">Pular</button>` : ''}`}</div>`;

  return `<div class="item ${ok ? 'ok' : ''} ${pulado ? 'skipped' : ''} ${isNext ? 'isnext' : ''} ${late && !isNext ? 'islate' : ''} ${aberto ? 'open' : ''}" id="it-${it.k}">
    <div class="ih">
      <button class="ck" title="${ck ? 'Desmarcar' : 'Marcar como feito'}" onclick="${ck ? `desmarcar('${it.k}')` : `marcar('${it.k}')`}"><svg viewBox="0 0 24 24"><path d="M5 12l5 5L20 7"/></svg></button>
      <span class="hr">${hhmm(it.quando)}</span>
      <div class="tt" onclick="alternar('${it.k}')" style="cursor:pointer"><span class="k ${it.tipo}">${it.tipo === 'msg' ? 'Mensagem' : 'Ação'}</span><b>${esc(it.tit)}</b></div>
      ${st}
      <button class="tog" onclick="alternar('${it.k}')" aria-label="Abrir"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg></button>
    </div>
    <div class="ib">${corpo}</div></div>`;
}

function alternar(k) {
  abertos.has(k) ? abertos.delete(k) : abertos.add(k);
  document.getElementById('it-' + k).classList.toggle('open');
}
function irPara(k) {
  abertos.add(k);
  renderEvento(false, true);
  document.getElementById('it-' + k).scrollIntoView({ block: 'center', behavior: 'smooth' });
}
async function copiarMsg(k) {
  const texto = msgTexto(k, ctx(atual));
  await copiar(texto);
  toast(faltando(texto).length ? 'Copiado, mas ainda tem link faltando' : 'Mensagem copiada');
}

async function marcar(k, pular) {
  const linha = { evento_id: atual.id, chave: k, pulado: !!pular, feito_por: eu.id };
  const { error } = await sb.from('evs_checks').upsert(linha);
  if (error) { toast('Não salvou: ' + error.message); return; }
  checks[k] = { ...linha, feito_em: new Date().toISOString() };
  abertos.delete(k);
  renderEvento(false, true);
}
async function desmarcar(k) {
  const { error } = await sb.from('evs_checks').delete().eq('evento_id', atual.id).eq('chave', k);
  if (error) { toast('Não salvou: ' + error.message); return; }
  delete checks[k];
  renderEvento(false, true);
}
async function pularPassadas() {
  const agora = new Date();
  const linhas = itensDoEvento(atual).filter(i => i.tipo === 'msg' && !checks[i.k] && i.quando < agora && !mesmoDia(i.quando, agora))
    .map(i => ({ evento_id: atual.id, chave: i.k, pulado: true, feito_por: eu.id }));
  if (!linhas.length) return;
  const { error } = await sb.from('evs_checks').upsert(linhas);
  if (error) { toast('Não salvou: ' + error.message); return; }
  linhas.forEach(l => { checks[l.chave] = l; });
  renderEvento(true);
}

async function salvarCampo(campo, valor) {
  let v = typeof valor === 'string' ? valor.trim() : valor;
  if (campo === 'edicao') v = v ? Number(v) : null;
  else if (campo !== 'data' && campo !== 'hora') v = v || null;
  if ((campo === 'data' || campo === 'hora') && !v) return;
  const { error } = await sb.from('evs_eventos').update({ [campo]: v }).eq('id', atual.id);
  if (error) { $('ficha-msg').textContent = 'Não salvou: ' + error.message; return; }
  atual[campo] = campo === 'hora' ? v + ':00' : v;
  renderEvento(false, true);
  $('ficha-msg').textContent = 'Salvo. As mensagens já foram atualizadas.';
}

async function concluir() {
  if (!confirm('Concluir este evento? Ele vai para a lista de concluídos.')) return;
  const { error } = await sb.from('evs_eventos').update({ status: 'concluido', concluido_em: new Date().toISOString() }).eq('id', atual.id);
  if (error) { toast('Não salvou: ' + error.message); return; }
  if (!checks['a-concluir']) await sb.from('evs_checks').upsert({ evento_id: atual.id, chave: 'a-concluir', pulado: false, feito_por: eu.id });
  const base = { ...atual };
  await carregarEventos();
  mostrarLista();
  const jaTemProximo = eventos.some(e => e.status === 'ativo' && e.data > base.data);
  if (!jaTemProximo) novoEvento(base);
  else toast('Evento concluído');
}
async function reabrir() {
  const { error } = await sb.from('evs_eventos').update({ status: 'ativo', concluido_em: null }).eq('id', atual.id);
  if (error) { toast('Não salvou: ' + error.message); return; }
  atual.status = 'ativo';
  renderEvento(true);
}
async function excluirEvento() {
  if (!confirm('Excluir este evento e todo o checklist dele? Não dá para desfazer.')) return;
  const { error } = await sb.from('evs_eventos').delete().eq('id', atual.id);
  if (error) { toast('Não excluiu: ' + error.message); return; }
  await carregarEventos();
  mostrarLista();
}

iniciar();
</script>
</body>
</html>
