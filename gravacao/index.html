<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gravação do evento | Método Demanda Infinita®</title>
<meta name="description" content="A gravação completa do evento: como gerar 30 reuniões por mês com o LinkedIn. Assista no seu ritmo.">
<meta property="og:title" content="Gravação do evento: 30 reuniões por mês com o LinkedIn">
<meta property="og:description" content="Assista à gravação completa do evento, no seu ritmo.">
<meta property="og:type" content="website">
<meta property="og:image" content="https://demandainfinita.com/gravacao/logo-demanda-infinita.png">
<link rel="icon" href="logo-demanda-infinita.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --green:#008E43;
    --green-light:#12B85E;
    --bg:#F8F7F4;
    --text:#111111;
    --gray:#6B6B6B;
    --line:#D8D5CE;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:'Inter',sans-serif; font-size:18px; line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  h1{font-family:'Plus Jakarta Sans',sans-serif; margin:0; text-wrap:balance;}
  .wrap{max-width:820px; margin:0 auto; padding:0 20px 64px;}

  .cover{padding:48px 0 28px; text-align:center;}
  .cover img.logo{width:76px; height:76px; margin-bottom:20px;}
  .cover .kicker{font-size:14px; font-weight:700; letter-spacing:1.5px; color:var(--green); text-transform:uppercase;}
  .cover h1{font-size:43px; font-weight:800; margin-top:10px; line-height:1.15; letter-spacing:-.02em;}
  .cover .sub{font-size:19px; color:var(--gray); max-width:560px; margin:14px auto 0; text-wrap:balance;}

  .video-embed{position:relative; width:100%; padding-bottom:56.25%; height:0; border-radius:16px; overflow:hidden; background:#000; box-shadow:0 26px 60px -30px rgba(0,0,0,.55);}
  .video-embed iframe{position:absolute; top:0; left:0; width:100%; height:100%; border:0;}

  .cta{margin-top:44px; text-align:center;}
  .cta .q{font-family:'Plus Jakarta Sans',sans-serif; font-weight:800; font-size:24px; line-height:1.3; max-width:520px; margin:0 auto 22px;}
  .btn-cta{
    display:inline-flex; align-items:center; justify-content:center; gap:10px;
    background:linear-gradient(135deg,#17D26E,#008E43);
    color:#fff; text-decoration:none; font-family:'Plus Jakarta Sans',sans-serif; font-weight:800;
    font-size:21px; padding:19px 42px; border-radius:999px;
    box-shadow:0 14px 34px -8px rgba(18,184,94,.55), 0 0 0 1px rgba(255,255,255,.08) inset;
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .btn-cta:hover{transform:translateY(-2px); box-shadow:0 20px 40px -8px rgba(18,184,94,.7), 0 0 0 1px rgba(255,255,255,.1) inset;}

  footer{text-align:center; font-size:13px; color:var(--gray); margin-top:48px; letter-spacing:1.4px; text-transform:uppercase; font-weight:600;}

  @media (max-width:600px){
    body{font-size:17px;}
    .cover{padding-top:36px;}
    .cover h1{font-size:32px;}
    .cover .sub{font-size:17px;}
    .cta .q{font-size:21px;}
    .btn-cta{display:flex; width:100%; font-size:18px; padding:17px 24px;}
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="cover">
    <img class="logo" src="logo-demanda-infinita.png" alt="Demanda Infinita">
    <div class="kicker">Gravação do evento</div>
    <h1>Como gerar 30 reuniões por mês com o LinkedIn</h1>
    <div class="sub">A gravação completa do evento. Dá o play e assiste no seu ritmo.</div>
  </div>

  <div class="video-embed">
    <iframe src="https://www.youtube.com/embed/tUEwXgXC0YM?rel=0" title="Gravação do evento — Demanda Infinita" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
  </div>

  <div class="cta">
    <div class="q">Quer aplicar isso no seu negócio?</div>
    <a class="btn-cta" href="https://cal.com/igor-miguel/demanda-infinita?overlayCalendar=true" target="_blank" rel="noopener">📅 Agendar consultoria estratégica</a>
  </div>

  <footer>Método Demanda Infinita®</footer>

</div>
</body>
</html>
